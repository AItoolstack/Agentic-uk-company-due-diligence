<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Pre-Screen · ai·toolstack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  The case page (UI blueprint, Direction B): Desk at /case, a case at /case/<report id>.
  Ships beside the page at / until Tej approves it. Vanilla JS, one file, same API as prescreen.html.
  The route comes from the rules; this page only shows it. Nothing here decides anything.
-->
<style>
:root{
  --ink:#101828;--ink2:#344054;--ink3:#475467;--sub:#667085;--faint:#98A2B3;--line:#E4E7EC;--rule:#F1F3F6;--rule2:#F1F3F6;
  --page:#F6F7F9;--panel:#FFFFFF;--head:#F8F9FB;--rail:#101828;--rail2:#1D2939;
  --act:#2D4BD6;--act2:#1E3AA8;--actbg:#F5F7FF;
  --refer-bg:#FFFAEB;--refer:#B54708;--refer-b:#FEDF89;--refer-bar:#F79009;--refer-tint:#FFFCF5;
  --out-bg:#FEF3F2;--out:#B42318;--out-b:#FECDCA;--out-bar:#F04438;--out-tint:#FFFBFA;
  --note-bg:#F1F3F6;--note-b:#E4E7EC;
  --shadow:0 1px 2px rgba(16,24,40,.04);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 14px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--act);text-decoration:none}a:hover{color:var(--act2);text-decoration:underline}
:focus-visible{outline:2px solid var(--act);outline-offset:2px}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.mono{font-family:var(--mono)}
.sub{color:var(--sub)}
.k{font-size:12px;font-weight:500;color:var(--sub)}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
.small{font-size:12px}.s13{font-size:13px}

/* shell */
.app{display:flex;min-height:100vh}
.rail{flex:0 0 64px;background:var(--rail);color:#fff;z-index:30}
.railin{position:sticky;top:0;height:100vh;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.rail .brand{padding:0 0 12px;align-items:center}
.rail .brand .mark{display:flex}
.rail .brand{flex-direction:column;gap:6px}
.rail .brand>span:not(.mark),.rail .brand b .long,.rail .nav .lbl,.rail .railfoot .lbl{display:none}
.rail .nav a{width:40px;height:40px;min-height:40px;justify-content:center;padding:0;border-radius:8px;color:var(--faint);position:relative}
.rail .nav .badge{position:absolute;margin:0;top:2px;right:0;transform:none;padding:0 5px;font-size:11px;background:var(--refer-bar)}
.rail .railfoot{border-top:0;padding:8px 0;align-items:center}
.rail #policy{display:none}
.rail #rail-demo{font-size:10px;padding:0 5px}
.brand{padding:4px 12px 18px;display:flex;flex-direction:column}
.brand b{font-weight:700;font-size:15px}.brand>span{font-size:12px;color:#98A2B3}.brand .short{display:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 12px;border-radius:6px;color:#C9D1DD;font-size:14px}
.nav a:hover{background:var(--rail2);color:#fff;text-decoration:none}
.nav a[aria-current=page]{background:var(--rail2);color:#fff}
.nav svg{flex:none}
.nav .badge{margin-left:auto;font-size:12px;background:#344054;border-radius:10px;padding:0 7px;color:#fff}
.railfoot{margin-top:auto;padding:12px;font-size:12px;color:#98A2B3;border-top:1px solid var(--rail2);display:flex;flex-direction:column;gap:6px}
.railfoot a{color:#D0D5DD}
.topbar{display:none;background:var(--rail);color:#fff;align-items:center;gap:6px;padding:0 8px 0 4px;height:56px;position:sticky;top:0;z-index:40}
.topbar .name{font-weight:700;font-size:15px;color:#fff}
.topbar a.tb{color:#fff;display:inline-flex;align-items:center;min-height:44px;padding:0 10px;font-size:14px}
.topbar a.tbnew{color:var(--ink);background:#fff;border-radius:6px;display:inline-flex;align-items:center;min-height:36px;padding:0 12px;font-weight:600;white-space:nowrap}
.iconbtn{width:44px;height:44px;border:0;background:none;color:#fff;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer}
.body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
#screen{flex:1 1 auto;min-width:0}
.statusbar{border-top:1px solid var(--line);background:#fff;padding:10px 32px;display:flex;flex-wrap:wrap;gap:4px 20px;font-size:12px;color:var(--sub);min-height:32px}
.scrim{display:none}

/* screen header */
.shead{background:#fff;border-bottom:1px solid var(--line);padding:16px 32px 0}
.shead.plain{padding-bottom:16px}
.crumb{font-size:13px;color:var(--sub)}
.titlerow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:6px}
.titlerow h1{font-size:24px;font-weight:600;letter-spacing:-.015em;outline:none}
.titlerow .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.facts{margin:16px 0 0;display:flex;flex-wrap:wrap;gap:12px 0}
.facts{display:grid;grid-template-columns:max-content max-content max-content minmax(150px,1.5fr) minmax(150px,1.2fr) minmax(130px,1fr);gap:12px 0}
.facts>div{padding:0 22px;border-left:1px solid var(--line);min-width:0}
.facts>div:first-child{padding-left:0;border-left:0}
.facts dt{font-size:12px;font-weight:500;color:var(--sub)}
.facts dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--sub);margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 16px}
.staleline{margin-top:8px;padding:8px 12px;border-radius:6px;background:var(--refer-bg);color:var(--refer);border:1px solid var(--refer-b);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;margin-top:8px;overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;min-height:44px;padding:0;margin-right:24px;border:0;background:none;font:500 14px var(--sans);color:var(--sub);border-bottom:2px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
.cnt{font-size:12px;color:var(--faint)}
.cnt.a,.cnt.r{width:6px;height:6px;border-radius:50%;background:var(--refer-bar);font-size:0;padding:0;overflow:hidden;display:inline-block}
.cnt.r{background:var(--out-bar)}

/* layout */
.wrap{padding:24px 32px 32px}
.cols{display:flex;gap:24px;align-items:flex-start}
.maincol{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:20px}
.aside{flex:0 0 360px;min-width:0;display:flex;flex-direction:column;gap:20px}
.aside.stick{position:sticky;top:12px}
.desk{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.deskl{flex:1 1 340px;max-width:420px;min-width:0;display:flex;flex-direction:column;gap:16px}
.deskr{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;box-shadow:var(--shadow)}
.ph{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--rule);min-height:48px;flex-wrap:wrap}
.ph h2{font-size:14px;font-weight:600;letter-spacing:-.005em}
.pb{padding:16px 20px}
.ph .right{margin-left:auto}
.pb{padding:14px 16px}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:500;color:var(--sub);text-align:left;padding:9px 12px;background:#fff;border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{padding-left:20px}.tbl th:last-child,.tbl td:last-child{padding-right:20px}
.tbl td{padding:12px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl td.mono{white-space:nowrap}
.tbl tr.grp>td{background:var(--head);font-weight:600;font-size:13px}
.tbl tr:last-child>td{border-bottom:0}
.tbl tr.grp>td{background:var(--head);font-weight:600;padding:8px 12px}
.tbl tr.dim td,.tbl tr.dim a{color:var(--sub)}
.empty{padding:16px 20px;color:var(--sub)}
.tbl.fixed{table-layout:fixed;min-width:560px}.tbl.fixed td{overflow-wrap:anywhere}

/* pills and glyphs */
.pill{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent;line-height:1.2}
a.pill:hover{text-decoration:none;filter:brightness(.97)}
.p-hold{background:#101828;color:#fff;border-color:#101828}
.p-out{background:var(--out-bg);color:var(--out);border-color:var(--out-b)}
.p-refer{background:var(--refer-bg);color:var(--refer);border-color:var(--refer-b)}
.p-refer .g,.ck.refer .g{color:var(--refer-bar)}.p-out .g,.ck.out .g{color:var(--out-bar)}
.p-note{background:var(--note-bg);color:var(--ink3);border-color:transparent}
.p-clear{background:#fff;color:var(--ink3);border-color:var(--line);font-weight:500}
.p-gap{background:#fff repeating-linear-gradient(135deg,transparent 0 3px,#EAECF0 3px 5px);color:var(--ink2);border-color:#98A2B3;font-weight:500}
.p-nc{background:#fff;color:var(--ink2);border:1px dashed #98A2B3;font-weight:500}
.p-na{background:none;color:var(--sub);border-color:transparent;font-weight:500}
.p-pend{background:#fff;color:var(--ink2);border-color:var(--note-b);font-weight:500}
.p-exact{background:#fff;color:var(--ink3);border-color:var(--line);font-weight:500}
.p-demo{background:#344054;color:#fff;border-color:#344054}
.g{flex:none;display:inline-block}

/* buttons and forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid #D0D5DD;background:#fff;color:var(--ink2);font:500 13px var(--sans);cursor:pointer;white-space:nowrap;text-decoration:none;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.btn:hover{background:#F9FAFB;text-decoration:none}
.btn.pri{background:var(--act);border-color:var(--act);color:#fff}
.btn.pri:hover{background:var(--act2)}
.btn:disabled,.btn[aria-disabled=true]{background:#F1F3F6;border-color:#E4E7EC;color:#98A2B3;cursor:not-allowed;box-shadow:none}
.btn.wide{width:100%}
.btn[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:30px;padding:0 12px;border:1px solid #D0D5DD;border-radius:15px;background:#fff;font:500 12px var(--sans);color:var(--ink2);cursor:pointer}
.chip{border-color:var(--line);color:var(--ink3)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.seg{display:flex}
.seg{padding:2px;background:var(--note-bg);border-radius:8px}
.seg button{min-height:28px;padding:0 10px;border:0;border-radius:6px;background:none;font:500 12px var(--sans);color:var(--ink3);cursor:pointer}
.seg button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}
label{font-size:13px;font-weight:500;color:var(--ink2)}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=search],textarea,select{border:1px solid #D0D5DD;border-radius:8px;padding:8px 10px;width:100%;color:var(--ink);background:#fff;font-size:14px}
input[type=text],input[type=search],select{min-height:38px}
input[aria-invalid=true],textarea[aria-invalid=true]{border-color:#D92D20}
.hint{font-size:12px;color:var(--sub)}
.readas{font-size:12px;color:var(--act2)}
.err{font-size:12px;color:var(--out)}
.cb{display:flex;gap:8px;align-items:center;min-height:32px;font-weight:400;color:var(--ink)}
.cbgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";display:inline-block;width:7px;height:7px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(-45deg);margin-right:10px;transition:transform .1s;flex:none}
details[open]>summary::before{transform:rotate(45deg)}
.sum{display:flex;align-items:center;gap:8px;padding:10px 16px;min-height:44px;font-weight:500;flex-wrap:wrap}
.msg{padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:13px}
.msg.bad{background:var(--out-bg);border-color:var(--out-b);color:var(--out)}
.msg.warn{background:var(--refer-bg);border-color:var(--refer-b);color:var(--refer)}

/* summary strip */
.summary{display:grid;grid-template-columns:1.35fr 1fr 1fr 1.2fr}
.summary>div{padding:18px 20px;border-left:1px solid var(--rule);min-width:0}
.summary>div:first-child{border-left:0}
.summary .big{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:6px;display:flex;align-items:center;gap:8px}
.summary .big small{font-size:14px;font-weight:500;color:var(--sub)}
.ticks{display:flex;gap:3px;margin-top:8px}
.ticks span{flex:1;height:6px;border-radius:2px;background:var(--ink3);min-width:2px}
.ticks .gap{background:repeating-linear-gradient(90deg,#fff 0 2px,#D0D5DD 2px 4px);box-shadow:inset 0 0 0 1px var(--faint)}
.ticks .nc{background:#fff;box-shadow:inset 0 0 0 1px var(--faint)}
.w-refer{color:var(--refer)}.w-out{color:var(--out)}.w-note{color:var(--ink2)}
.w-refer .g{color:var(--refer-bar)}.w-out .g{color:var(--out-bar)}
/* checks by question */
.qrow2{display:grid;grid-template-columns:220px minmax(0,1fr) 130px;gap:16px;align-items:center;padding:12px 20px;border-top:1px solid var(--rule)}
.qrow2:first-child{border-top:0}
.qrow2.review{background:var(--refer-tint)}.qrow2.review.out{background:var(--out-tint)}
.ck{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink3);text-decoration:none}
.ck:hover{color:var(--ink);text-decoration:underline}
.ck .g{color:var(--faint)}
.ck.refer{color:var(--refer);font-weight:500}.ck.out{color:var(--out);font-weight:500}.ck.dim{color:var(--faint)}
/* outcome */
.outcome{overflow:hidden;border-top-width:3px}
.outcome .in{display:flex;flex-wrap:wrap}
.outcome .l{flex:999 1 340px;padding:16px 20px}
.outcome .r{flex:1 1 280px;padding:16px 20px;border-left:1px solid var(--rule2);background:#FCFCFD}
.outcome .word{font-size:24px;font-weight:700}
.o-note{border-top-color:#98A2B3}.o-refer{border-top-color:var(--refer-bar)}.o-out{border-top-color:#D92D20}
.o-refer .word{color:var(--refer)}.o-out .word{color:var(--out)}.o-note .word{color:var(--ink2)}
.holdpanel{background:#101828;color:#fff;border-radius:6px;padding:18px 20px}
.holdpanel .k{color:#98A2B3}
.ended{background:var(--out-bg);border:1px solid var(--out-b);color:var(--out);border-radius:6px;padding:12px 16px;font-weight:600}
.bar{display:flex;gap:2px;margin-top:8px;height:8px}
.bar span{border-radius:2px;min-width:3px}
.bar .done{background:#344054}.bar .gap{background:repeating-linear-gradient(135deg,#fff 0 2px,#98A2B3 2px 3px);border:1px solid #98A2B3}.bar .nc{border:1px dashed #98A2B3}

/* reasons and drawer */
.rowbtn{all:unset;cursor:pointer;display:flex;gap:10px;align-items:flex-start;width:100%}
.rowbtn:focus-visible{outline:2px solid var(--act);outline-offset:2px;border-radius:2px}
.chev{flex:none;width:8px;height:8px;margin-top:6px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(-45deg)}
.rowbtn[aria-expanded=true] .chev{transform:rotate(45deg)}
.drawer>td{background:var(--head)!important;padding:14px 16px!important}
.kv{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}
.kv dt{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sub)}
.kv dd{margin:2px 0 0;overflow-wrap:anywhere}
.kv .full{grid-column:1/-1}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-top:12px}
.mini{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.mini th,.mini td{text-align:left;padding:4px 8px 4px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.mini th{font-weight:600;color:var(--sub);font-size:12px}

/* checks by question */
.qrow td:first-child{width:200px}
.pills{display:flex;flex-wrap:wrap;gap:6px}

/* rail panels */
.opt{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:1px solid #D0D5DD;border-radius:6px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.opt.sel{border-color:var(--act);background:var(--actbg)}
.opt.off{color:#98A2B3;cursor:not-allowed}
.opt.hold.sel{border-color:#101828;background:#F2F4F7}
.opt .m{margin-left:auto;font-size:12px;font-weight:400;color:var(--sub)}
.idbox{display:flex;gap:10px;align-items:flex-start;font-weight:400;padding:10px 12px;border:1px solid #D0D5DD;border-radius:6px;background:var(--head);color:var(--ink);cursor:pointer}
.idbox input{margin-top:3px}
.override{padding:8px 12px;border-radius:6px;background:var(--refer-bg);color:var(--refer);font-size:13px;font-weight:500}
.recorded{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--head)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.hist li{border-left:2px solid var(--line);padding-left:10px}
.textbox{font:12px/1.5 var(--mono);white-space:pre-wrap;background:var(--head);border:1px solid var(--rule2);border-radius:6px;padding:10px 12px;max-height:280px;overflow:auto;overflow-wrap:anywhere;margin:0}
.textbox.prose{font:13px/1.5 var(--sans)}
.qlist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.todo{margin:0;padding:10px 16px 12px 32px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.switch{display:flex;gap:10px;align-items:flex-start;font-weight:400;color:var(--ink);cursor:pointer}

/* running */
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stages li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.stages li:last-child{border-bottom:0}
.stages .dt{margin-left:auto;font-size:12px;color:var(--sub);text-align:right}
.dot{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid #D0D5DD}
.st-start .dot{border-color:var(--act);border-right-color:transparent;animation:spin 1s linear infinite}
.st-done .dot{background:#344054;border-color:#344054}
.st-error .dot{background:repeating-linear-gradient(135deg,#fff 0 2px,#98A2B3 2px 3px);border-color:#98A2B3;border-radius:2px}
.st-skip .dot{border-style:dashed}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.st-start .dot{animation:none}}

/* timeline */
.tl{list-style:none;margin:0;padding:0 16px 8px}
.tl li{display:grid;grid-template-columns:110px 90px 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.tl li.mat .t{font-weight:600}
.tl li.mat{background:var(--refer-tint);margin:0 -20px;padding-left:20px;padding-right:20px}
.tl li.serious{background:var(--out-tint)}
.tl li.mat .g{color:var(--refer-bar)}.tl li.serious .g{color:var(--out-bar)}
.tl{padding:0 20px 8px}
.tl li:last-child{border-bottom:0}

/* the sticky decide button on one-column layouts */
.decidebar{display:none}

/* ---- responsive ---- */
@media (max-width:1279px){
  .aside{flex-basis:320px}
  .tbl.fixed{table-layout:auto;min-width:0}
  .tbl.fixed col{width:auto!important}
  .tbl.fixed td.mono,.tbl.fixed td[data-l=Area]{white-space:nowrap}
  .tbl.fixed td[data-l=Source]{min-width:120px}
  .qrow2{grid-template-columns:minmax(0,1fr) auto;gap:8px 16px}
  .qrow2>div:nth-child(2){grid-column:1/-1;grid-row:2}
  .facts{grid-template-columns:repeat(3,minmax(0,1fr))}

<script>
"use strict";
/* ======================================================================
   Helpers
   ====================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u || "")) ? esc(u) : "#";
const TZ = "Europe/London";
// "13 Sep 2026", always: Chrome's en-GB short month is "Sept", which the copy rules don't use.
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function dateParts(d) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", {day: "numeric", month: "numeric", year: "numeric", timeZone: TZ}).formatToParts(d).map(x => [x.type, x.value]));
  return {day: String(Number(p.day)), mon: MONTHS[Number(p.month) - 1], year: p.year};
}
function fmtDate(s) {
  if (!s) return "";
  const d = new Date(String(s).length === 10 ? s + "T12:00:00Z" : s);
  if (isNaN(d)) return esc(s);
  const p = dateParts(d);
  return `${p.day} ${p.mon} ${p.year}`;
}
function fmtDayMon(s) { const d = new Date(s); if (isNaN(d)) return ""; const p = dateParts(d); return `${p.day} ${p.mon}`; }
function fmtTime(s) { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit", timeZone: TZ}); }
function fmtWhen(s) { const d = new Date(s); return isNaN(d) ? "" : `${fmtDate(s)}, ${fmtTime(s)}`; }
function fmtShort(s) { const d = new Date(s); return isNaN(d) ? "" : fmtDayMon(s) + " " + fmtTime(s); }
function yearsSince(s) { const d = new Date(s); if (isNaN(d)) return ""; const y = Math.floor((Date.now() - d) / 31557600000); return y < 1 ? "under a year" : `${y} year${y === 1 ? "" : "s"}`; }
const plural = (n, w, many) => `${n} ${n === 1 ? w : (many || w + "s")}`;
const isStale = r => r && (r.stale || (Date.now() - new Date(r.created_at)) > 24 * 3600e3);
function titleCase(name) {
  const keep = new Set(["PLC", "LLP", "UK", "LP", "CIC", "UAB", "DAC"]);
  return String(name || "").split(/\s+/).map(w => keep.has(w) ? w : (w === w.toUpperCase() ? w.charAt(0) + w.slice(1).toLowerCase() : w)).join(" ");
}
// Provider names stay in the Analysis tab. Elsewhere the news source is "web news search".
const plain = s => String(s ?? "").replace(/\bBrave Search\b|\bGDELT \(free\)|\bGDELT\b(?! \()|\bBrave\b/g, "web news search").replace(/web news search \(fallback\)/g, "web news search (fallback)");
function announce(text) { const l = $("#live"); l.textContent = ""; setTimeout(() => { l.textContent = text; }, 60); }

/* ---------- vocabulary ---------- */
const ROUTE = {note: "No referral", refer: "Refer", outside_appetite: "Outside appetite", compliance_hold: "Compliance hold"};
const ROUTE_LONG = {note: "No referral triggered by completed checks", refer: "Refer", outside_appetite: "Outside appetite", compliance_hold: "Held for compliance"};
const RANK = {note: 0, refer: 1, outside_appetite: 2, compliance_hold: 3};
const PILL = {note: "p-note", refer: "p-refer", outside_appetite: "p-out", compliance_hold: "p-hold"};
const GLYPH_OF_ROUTE = {note: "ring", refer: "tri", outside_appetite: "stop", compliance_hold: "square"};
const DECISION = {proceed: "Proceed to quote", refer: "Refer", decline: "Decline", compliance: "Referred to compliance"};
const DECIDED = {proceed: "Proceeding to quote", refer: "Referred", decline: "Declined", compliance: "Referred to compliance"};
const DECISION_PILL = {proceed: "p-note", refer: "p-refer", decline: "p-out", compliance: "p-hold"};
const EXPECTED = {note: "proceed", refer: "refer", outside_appetite: "decline", compliance_hold: "compliance"};
const COVER = [["property", "Property"], ["liability", "EL / PL"], ["management_liability", "D&O / management liability"],
  ["professional_indemnity", "Professional indemnity"], ["cyber", "Cyber"], ["financial_institutions", "Financial institutions"], ["motor_fleet", "Motor fleet"]];
const COVER_NAME = Object.fromEntries(COVER);
const GROUPS = [
  {id: "identity", title: "Identity & ownership", q: "Is it who the proposal says, and who owns it?"},
  {id: "financial", title: "Financial standing", q: "Is it keeping up, or in distress?"},
  {id: "management", title: "Management", q: "Who runs it, and what is their record?"},
  {id: "regulatory", title: "Regulatory & legal", q: "Is it allowed to do this? Is anyone acting?"},
  {id: "reputation", title: "Reputation", q: "What is said about it in public?"},
];
const GROUP_TITLE = Object.fromEntries(GROUPS.map(g => [g.id, g.title]));
const AREA = {identity: "Identity", financial: "Financial", management: "Management", regulatory: "Regulatory", reputation: "Reputation"};
const SANCTIONS_RULES = new Set(["sanctions_strong", "sanctions_possible", "sanctions_discounted"]);
const COMPLIANCE_ONLY = new Set(["sanctions_strong", "sanctions_possible"]);
const ENDED = ["dissolved", "liquidation", "converted-closed", "closed", "insolvency-proceedings", "administration", "receivership", "voluntary-arrangement"];
// What the public record can't tell you, by finding (shown in the evidence drawer).
const NOT_ON_RECORD = {
  fca_discipline: "Whether the remediation the FCA describes is complete.",
  director_insolvent_links: "Why the other company failed, or this person's part in it.",
  phoenix_pattern: "Whether assets or customers moved from the old company, and on what terms.",
  accounts_overdue: "Current trading, or management accounts.", accounts_overdue_serious: "Current trading, or management accounts.",
  charges_burst: "What was borrowed, from whom, and on what terms.",
  media_high: "Whether the reports are accurate, or the matter is resolved.",
  company_insolvent: "Who the insolvency practitioner is and what cover they need.",
  winding_up_petition: "Whether the petition has been paid, withdrawn or dismissed.",
  trade_mismatch: "Which activity the business actually carries on today.",
  dormant_but_trading: "Which company actually trades.",
  director_disqualified: "The conduct behind the disqualification, beyond the register entry.",
};

/* ---------- glyphs: one look everywhere ---------- */
function glyph(kind, size = 10) {
  const s = size, h = `width="${s}" height="${s}" viewBox="0 0 10 10" class="g" aria-hidden="true" focusable="false"`;
  switch (kind) {
    case "square": return `<svg ${h}><rect width="10" height="10" fill="currentColor"/></svg>`;
    case "stop": return `<svg ${h}><path d="M3 0h4l3 3v4l-3 3H3L0 7V3z" fill="currentColor"/></svg>`;
    case "tri": return `<svg ${h}><path d="M5 .5 9.7 9.3H.3z" fill="currentColor"/></svg>`;
    case "ring": return `<svg ${h}><circle cx="5" cy="5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;
    case "tick": return `<svg ${h}><path d="M1.2 5.3 4 8 8.8 2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;
    case "hatch": return `<svg ${h}><rect x=".6" y=".6" width="8.8" height="8.8" fill="none" stroke="currentColor"/><path d="M0 7 7 0M3 10 10 3" stroke="currentColor"/></svg>`;
    case "dashed": return `<svg ${h}><rect x=".6" y=".6" width="8.8" height="8.8" fill="none" stroke="currentColor" stroke-dasharray="2 1.4"/></svg>`;
    default: return `<svg ${h}><path d="M2 5h6" stroke="currentColor" stroke-width="1.6"/></svg>`;
  }
}
const routePill = (r, text) => `<span class="pill ${PILL[r] || "p-note"}">${glyph(GLYPH_OF_ROUTE[r])}${esc(text || ROUTE[r] || r)}</span>`;
const worstRoute = c => (c.findings || []).reduce((w, f) => RANK[f.route] > RANK[w] ? f.route : w, "note");
const notCovered = c => c.status === "couldnt_check" && (c.out_of_scope || (c.check_id === "ccj" && /paid|not connected/i.test(c.not_checked_reason || c.summary || "")));
function checkState(c) {
  if (c.status === "flag") { const w = worstRoute(c); return {cls: PILL[w] || "p-refer", g: GLYPH_OF_ROUTE[w] || "tri", word: ROUTE[w] === "No referral" ? "Note" : ROUTE[w], key: w === "note" ? "note" : "refer"}; }
  if (c.status === "info") return {cls: "p-note", g: "ring", word: "Note", key: "note"};
  if (c.status === "clear") return {cls: "p-clear", g: "tick", word: "Nothing found", key: "clear"};
  if (notCovered(c)) return {cls: "p-nc", g: "dashed", word: "Not covered", key: "nc"};
  if (c.status === "couldnt_check") return {cls: "p-gap", g: "hatch", word: "Couldn't check", key: "gap"};
  return {cls: "p-na", g: "dash", word: "Not applicable", key: "na"};
}

/* ======================================================================
   Proposal parsing: the same rules as src/prescreen/caseview.py (tests/test_caseview.py)
   ====================================================================== */
const MONEY_RE = /^£? ?(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))? ?(k|m|mn|bn|b)?$/i;
const MULT = {k: 1e3, m: 1e6, mn: 1e6, b: 1e9, bn: 1e9};
function parseMoney(text) {
  const s = String(text ?? "").trim();
  if (!s) return {ok: true, value: null};
  const m = s.match(MONEY_RE);
  if (!m) return {ok: false, error: "Enter an amount in pounds, for example £2.4m, 750k or 2,400,000."};
  const whole = m[1], unit = (m[3] || "").toLowerCase(), mult = MULT[unit] || 1;
  let frac = m[2] || "";
  if (frac && mult === 1) { if (/[^0]/.test(frac)) return {ok: false, error: "Enter whole pounds, for example 2400000, or use m or k: £2.4m."}; frac = ""; }
  const w = BigInt(whole.replace(/,/g, "")) * BigInt(mult);
  let value = w;
  if (frac) {
    const num = BigInt(frac) * BigInt(mult), den = 10n ** BigInt(frac.length);
    if (num % den) return {ok: false, error: "That's not a whole number of pounds; enter it in full, for example 2,400,000."};
    value = w + num / den;
  }
  if (value > 10n ** 12n) return {ok: false, error: "That amount is too large to be a turnover; check it."};
  return {ok: true, value: Number(value)};
}
function parseYears(text) {
  const s = String(text ?? "").trim();
  if (!s) return {ok: true, value: null};
  if (!/^\d{1,3}$/.test(s)) return {ok: false, error: "Whole years only, for example 2."};
  const v = Number(s);
  return v > 300 ? {ok: false, error: "Enter whole years between 0 and 300."} : {ok: true, value: v};
}
const money = v => v == null ? "" : "£" + Number(v).toLocaleString("en-GB");
const NUMBER_RE = /^\s*(?:[A-Za-z]{2}\s*\d{6}|[A-Za-z]{2}\s*\d{5}\s*[A-Za-z]|\d{6,8})\s*$/;  // IP00525R: a registered society
const normNumber = s => { const n = s.replace(/\s+/g, "").toUpperCase(); return /^\d+$/.test(n) ? n.padStart(8, "0") : n; };

/* ======================================================================
   API
   ====================================================================== */
function code() { try { return sessionStorage.getItem("prescreen-code") || ""; } catch (e) { return ""; } }
class ApiError extends Error { constructor(msg, status) { super(msg); this.status = status; } }
function detailText(body, status) {
  const d = body && body.detail;
  if (Array.isArray(d)) return d.map(x => String(x.msg || "").replace(/^Value error, /, "")).join("; ");
  return d || `Request failed (${status})`;
}
async function api(path, opts = {}) {
  let r;
  try { r = await fetch(path, {...opts, headers: {"Content-Type": "application/json", "X-Access-Token": code()}}); }
  catch (e) { throw new ApiError("The service didn't answer. Check your connection and try again.", 0); }
  const body = await r.json().catch(() => ({}));
  if (r.status === 401) { S.needCode = true; throw new ApiError("Enter the access code to use this service.", 401); }
  if (!r.ok) throw new ApiError(detailText(body, r.status), r.status);
  return body;
}

/* ======================================================================
   State and routing
   ====================================================================== */
const S = {
  config: null, needCode: false, report: null, tab: "overview", checkFilter: "all", checkOnly: "", openDrawer: "",
  form: {q: "", cover: [], trade: "", turnover: "", years: "", directors: "", fca: false, rerunOf: "", rerunName: ""},
  candidates: null, casesFilter: "all", casesPage: 1, cases: null, changes: [], watched: new Map(),
  brokerView: "q", agentRun: null, agentCfg: null, recordingAnother: false, decisionDraft: null, histFilter: {kind: "", material: true},
};
function uwName() { try { return localStorage.getItem("prescreen-uw") || ""; } catch (e) { return ""; } }
function setUwName(v) { try { localStorage.setItem("prescreen-uw", v); } catch (e) {} }

function go(path, {replace = false} = {}) {
  if (replace) history.replaceState(null, "", path); else history.pushState(null, "", path);
  route();
}
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-nav]");
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  e.preventDefault(); closeMenu();
  const url = new URL(a.href);
  if (url.pathname + url.hash === location.pathname + location.hash && url.pathname === "/case") { route(); return; }
  go(url.pathname + url.search + url.hash);
});
window.addEventListener("popstate", route);

async function route() {
  if (location.pathname === "/") { history.replaceState(null, "", "/case" + location.search + location.hash); }
  const m = location.pathname.match(/^\/case\/([0-9a-f]{16})\/?$/);
  setNav(m ? "cases" : (location.hash.slice(1) || "new"));
  if (m) {
    const tab = location.hash.slice(1);
    if (TABS.some(t => t.id === tab)) S.tab = tab;
    if (!S.report || S.report.report_id !== m[1]) await loadCase(m[1]);
    else renderCase();
  } else {
    S.report = null; renderDesk();
  }
}
function setNav(id) { $$(".nav a").forEach(a => { if (a.dataset.navid === id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); }); }

/* ---------- menu (one-column widths) ---------- */
function openMenu() { $("#rail").classList.add("open"); $("#scrim").classList.add("open"); $("#menu-btn").setAttribute("aria-expanded", "true"); $(".nav a").focus(); }
function closeMenu() { $("#rail").classList.remove("open"); $("#scrim").classList.remove("open"); $("#menu-btn").setAttribute("aria-expanded", "false"); }
$("#menu-btn").onclick = () => $("#rail").classList.contains("open") ? closeMenu() : openMenu();
$("#scrim").onclick = closeMenu;
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("#rail").classList.contains("open")) { closeMenu(); $("#menu-btn").focus(); return; }
  if (S.openDrawer) { const id = S.openDrawer; S.openDrawer = ""; renderCase(); const b = document.querySelector(`[data-drawer="${id}"]`); if (b) b.focus(); }
});
</script>
<script>
"use strict";
/* ======================================================================
   Config, status bar, access code
   ====================================================================== */
async function loadConfig() {
  try { S.config = await api("/api/prescreen/config"); S.needCode = false; }
  catch (e) { S.config = null; }
  const demo = S.config && S.config.data === "demo";
  $("#rail-demo").hidden = !demo; $("#tb-demo").hidden = !demo;

/* ======================================================================
   Running a pre-screen (streamed stages)
   ====================================================================== */
let RUN_TIMER = null;
async function runPrescreen(number, name) {
  const body = requestBody(number), started = Date.now();
  // The engine's stages (engine.STAGES); the stream sends the same list first.
  let stages = [{id: "companies_house", label: "Companies House: profile, officers, owners, charges"}, {id: "gazette", label: "The Gazette: insolvency notices"},
    {id: "sanctions", label: "UK Sanctions List"}, {id: "directors", label: "Directors: disqualification and other companies"}, {id: "fca", label: "FCA Register"},
    {id: "news", label: "News and web, read against the company"}], state = {};
  S.candidates = null;
  history.pushState(null, "", "/case#running");
  setNav("new");
  document.title = `Running · ${number} · Company Pre-Screen · ai·toolstack`;
  statusBar(null);
  const label = name ? titleCase(name) : number;
  const draw = () => {
    const secs = Math.round((Date.now() - started) / 1000);
    $("#screen").innerHTML = `<header class="shead plain"><div class="crumb"><a href="/case#cases" data-nav>Cases</a> <span aria-hidden="true">/</span> ${esc(label)}</div>
      <div class="titlerow"><h1 id="case-title" tabindex="-1">${esc(label)}</h1><span class="pill p-pend">Pre-screen running</span></div>
      <div class="meta"><span class="mono">${esc(number)}</span><span>${S.form.cover.length ? esc(S.form.cover.map(c => COVER_NAME[c]).join(" · ")) : "General pre-screen"}</span></div></header>
      <div class="wrap"><section class="panel" style="max-width:680px" aria-labelledby="h-run"><div class="ph"><h2 id="h-run">Reading the registers</h2><span class="right mono sub" id="elapsed">${secs} s</span></div>
      <div class="pb"><ol class="stages">${stages.map(s => { const st = state[s.id] || {}; const cls = st.state || "wait";
        const words = cls === "done" ? (st.detail ? plain(st.detail) : "read") : cls === "error" ? "couldn't reach" : cls === "skip" ? plain(st.detail || "not needed") : cls === "start" ? "reading…" : "waiting";
        return `<li class="st-${cls}"><span class="dot" aria-hidden="true"></span><span>${esc(plain(s.label))}</span><span class="dt">${esc(words)}</span></li>`; }).join("")}</ol>
      <p class="hint" id="slow" ${secs >= 20 ? "" : "hidden"} style="margin:10px 0 0">Large boards take up to 2 minutes.</p></div></section></div>`;
  };
  draw();

    catch (e) { throw new ApiError("The service didn't answer. Check your connection and try again.", 0); }

<script>

}

/* ---------- copying, honestly ---------- */
function selectIn(el) { const range = document.createRange(); range.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); }
async function copyHonest(text, srcEl, msgEl, btn) {
  let ok = false;
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  if (ok) { const was = btn.textContent; btn.textContent = "Copied"; if (msgEl) msgEl.textContent = ""; announce("Copied."); setTimeout(() => { btn.textContent = was; }, 1800); return true; }

    t.onclick = () => selectTab(t.dataset.tab, true);
    t.onkeydown = e => { const ids = TABS.map(x => x.id), i = ids.indexOf(t.dataset.tab);
      const j = e.key === "ArrowRight" ? (i + 1) % ids.length : e.key === "ArrowLeft" ? (i - 1 + ids.length) % ids.length : e.key === "Home" ? 0 : e.key === "End" ? ids.length - 1 : -1;
      if (j >= 0) { e.preventDefault(); selectTab(ids[j], true); } };
  });
  $$("[data-tablink]").forEach(a => a.onclick = e => { e.preventDefault(); selectTab(a.dataset.tablink, true); });
  $$("[data-drawer]").forEach(b => b.onclick = () => { const k = b.dataset.drawer; S.openDrawer = S.openDrawer === k ? "" : k; renderCase(); const nb = document.querySelector(`[data-drawer="${k}"]`); if (nb) nb.focus({preventScroll: true}); });
  $$("[data-open]").forEach(a => a.onclick = e => { e.preventDefault(); openEvidence(a.dataset.open); });
  $$("[data-check]").forEach(a => a.onclick = e => { e.preventDefault(); S.checkOnly = a.dataset.check; S.checkFilter = "all"; selectTab("checks", false); const row = document.getElementById("chk-" + a.dataset.check); if (row) { row.scrollIntoView({block: "center"}); } const h = $("#h-checks"); if (h) { h.tabIndex = -1; h.focus({preventScroll: true}); } });
  $$("[data-cfilter]").forEach(b => b.onclick = () => { S.checkFilter = b.dataset.cfilter; renderCase(); const nb = document.querySelector(`[data-cfilter="${b.dataset.cfilter}"]`); if (nb) nb.focus(); });
  const co = $("#clear-only"); if (co) co.onclick = () => { S.checkOnly = ""; renderCase(); };
  const hk = $("#hist-kind"); if (hk) hk.onchange = () => { S.histFilter.kind = hk.value; renderCase(); $("#hist-kind").focus(); };
  const hm = $("#hist-mat"); if (hm) hm.onchange = () => { S.histFilter.material = hm.checked; renderCase(); $("#hist-mat").focus(); };
  const ha = $("#hist-all"); if (ha) ha.onclick = () => { S.histFilter.material = false; renderCase(); };
  const ep = $("#edit-prop"); if (ep) ep.onclick = () => { S.form = formFromRequest(r); go("/case#new"); };
  // header actions
  const rb = $("#rerun-btn"); if (rb) rb.onclick = () => rerun(r);
  const sr = $("#stale-rerun"); if (sr) sr.onclick = () => rerun(r);
  if (role() === "public") $$("[data-rerun], #stale-rerun").forEach(b => b.remove());
  $$("[data-rerun]").forEach(b => b.onclick = () => rerun(r));
  const wb = $("#watch-btn"); if (wb) wb.onclick = () => toggleWatch(r);
  $("#note-btn").onclick = async () => {
    const btn = $("#note-btn");
    try {
      const n = await api(`/api/prescreen/${r.report_id}/note`);
      const box = $("#note-fallback");
      box.innerHTML = `<pre class="textbox" id="note-src" tabindex="0" hidden aria-label="File note" style="margin-top:10px">${esc(n.text)}</pre><div class="hint" id="note-msg" role="status"></div>`;
      await copyHonest(n.text, $("#note-src"), $("#note-msg"), btn);
    } catch (e) { $("#note-fallback").innerHTML = `<div class="msg bad" role="alert" style="margin-top:10px">${esc(e.message)}</div>`; }
  };
  const dj = $("#decide-jump"); if (dj) dj.onclick = e => { e.preventDefault(); const d = $("#decision"); d.scrollIntoView({block: "start"}); const h = $("#h-dec"); if (h) h.focus({preventScroll: true}); };
  // decision
  wireDecision(r);
  // broker panel
  $$("[data-bview]").forEach(b => { b.onclick = () => { S.brokerView = b.dataset.bview; renderRail(r); const nb = document.querySelector(`[data-bview="${b.dataset.bview}"]`); if (nb) nb.focus(); };
    b.onkeydown = e => { if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return; e.preventDefault(); const all = $$("[data-bview]"), i = all.indexOf(b), n = all[(i + (e.key === "ArrowRight" ? 1 : all.length - 1)) % all.length]; S.brokerView = n.dataset.bview; renderRail(r); const nb = document.querySelector(`[data-bview="${n.dataset.bview}"]`); if (nb) nb.focus(); }; });
  const cb = $("#copy-btn");
  if (cb) cb.onclick = () => {
    const qs = r.broker_questions || [];
    const text = S.brokerView === "q" ? qs.map((q, i) => `${i + 1}. ${q.question}`).join("\n") : S.brokerView === "e" ? emailText(r) : (draftedEmail() || {}).text || "";
    let src = $("#copy-src");
    if (!src) { const ol = $(".qlist"); src = ol; }
    copyHonest(text, src, $("#copy-msg"), cb);
  };
  const ws = $("#watch-sw"); if (ws) ws.onchange = () => toggleWatch(r, true);
  // analysis
  const ar = $("#agent-run");
  if (ar) ar.onclick = async () => {
    ar.disabled = true; const m = $("#agent-msg"); m.textContent = "The analysis is running. This takes 20–60 seconds…"; announce("Analysis started.");
    try { S.agentRun = await api(`/api/prescreen/${r.report_id}/agent-review`, {method: "POST"}); renderCase(); announce("Analysis finished. Route unchanged."); const h = $("#h-an"); if (h) { h.tabIndex = -1; h.focus(); } }
    catch (e) { ar.disabled = false; m.textContent = e.message; announce("Analysis failed: " + e.message); }
  };
  if (S.tab === "analysis" && !S.agentCfg) api("/api/prescreen/agents/config").then(c => { S.agentCfg = c; if (S.tab === "analysis" && c.available === false) renderCase(); }).catch(() => {});
}
// The rail stays in view while you read, but only when it fits: never a scroll box inside the page.
function stickRail() { const a = $("#rail-panels"); if (a) a.classList.toggle("stick", a.offsetHeight < window.innerHeight - 24); }
window.addEventListener("resize", stickRail);
function renderRail(r) { const a = $("#rail-panels"); if (!a) return; a.innerHTML = railPanels(r); wireCase(r); stickRail(); }
function openEvidence(key) {
  if (S.tab !== "overview") { S.tab = "overview"; history.replaceState(null, "", `/case/${S.report.report_id}`); }
  S.openDrawer = key;
  const isNote = notesOf(S.report).some(f => f.key === key);
  renderCase();
  if (isNote) { const d = $("#notes"); if (d) d.open = true; }
  const b = document.querySelector(`[data-drawer="${key}"]`);
  if (b) { b.scrollIntoView({block: "center"}); b.focus({preventScroll: true}); }
}
async function toggleWatch(r, fromSwitch) {
  const on = S.watched.has(r.company_number), msg = $("#watch-msg");
  try {
    if (on) await api(`/api/prescreen/watch/${encodeURIComponent(r.company_number)}`, {method: "DELETE"});
    else await api("/api/prescreen/watch", {method: "POST", body: JSON.stringify({report_id: r.report_id})});
    await loadWatch(); renderCase();
    announce(on ? "No longer watching this company." : "Watching this company. Changes will appear on the Desk.");
    const el = fromSwitch ? $("#watch-sw") : $("#watch-btn"); if (el) el.focus({preventScroll: true});
  } catch (e) { if (msg) msg.textContent = e.message; }
}
function wireDecision(r) {
  const another = $("#another");
  if (another) another.onclick = () => { S.recordingAnother = true; S.decisionDraft = null; renderRail(r); const id = $("#id-ok"); if (id) id.focus(); };
  const cancel = $("#cancel-another"); if (cancel) cancel.onclick = () => { S.recordingAnother = false; renderRail(r); };
  const form = $("#dec-form"); if (!form) return;
  const d = S.decisionDraft, hold = isHold(r), expected = EXPECTED[r.route] || "refer";
  const sync = () => {
    d.idOk = $("#id-ok").checked; d.reason = $("#reason").value; d.uw = $("#uw").value;
    const ch = form.querySelector("input[name=dec]:checked"); d.choice = ch ? ch.value : expected;
    $$(".opt", form).forEach(l => l.classList.toggle("sel", l.querySelector("input").checked));
    const override = !hold && d.choice !== expected;
    $("#override").innerHTML = override ? `<div class="override">Overrides the recommended route (${esc(ROUTE[r.route])}). Give your reason, at least 20 characters.</div>` : "";
    $("#reason-h").textContent = override ? "At least 20 characters." : "At least 5 characters.";
    $("#record").disabled = !d.idOk;
    $("#record-h").textContent = d.idOk ? "" : "Confirm the identity match to record a decision.";
  };
  form.addEventListener("change", e => { sync(); if (e.target.id === "id-ok" || e.target.name === "dec") { const op = $("#rail-panels"); /* Outstanding mirrors identity */ const out = op && op.querySelector('[aria-labelledby="h-todo"]'); if (out) { out.outerHTML = outstandingPanel(r); $$("[data-rerun]").forEach(b => b.onclick = () => rerun(r)); } } });
  form.addEventListener("input", sync);
  form.onsubmit = async e => {
    e.preventDefault(); sync();
    const override = !hold && d.choice !== expected, min = override ? 20 : 5, reason = d.reason.trim();
    const errs = [];
    if (!d.idOk) errs.push("Confirm the identity match first.");
    if (reason.length < min) errs.push(override ? "This overrides the recommended route: give a reason of at least 20 characters." : "Give a reason of at least 5 characters.");
    if (!d.uw.trim()) errs.push("Enter the underwriter's name.");
    $("#reason").setAttribute("aria-invalid", String(reason.length < min)); $("#uw").setAttribute("aria-invalid", String(!d.uw.trim()));
    if (errs.length) { d.error = errs.join(" "); $("#dec-err").innerHTML = `<div class="msg bad">${esc(d.error)}</div>`; return; }
    const btn = $("#record"); btn.disabled = true; btn.textContent = "Recording…";
    try {
      setUwName(d.uw.trim());
      const entry = await api(`/api/prescreen/${r.report_id}/decision`, {method: "POST", body: JSON.stringify({decision: d.choice, reason, underwriter: d.uw.trim(), identity_confirmed: true, overrides_route: override})});
      r.decisions = [...(r.decisions || []), entry];
      S.recordingAnother = false; S.decisionDraft = null;
      renderCase();
      announce(`Decision recorded: ${DECISION[entry.decision]}${entry.overrides_route ? ", overriding the recommended route" : ""}.`);
      const h = $("#h-dec"); if (h) h.focus();
    } catch (err) {
      d.error = err.message; btn.disabled = false; btn.textContent = hold ? "Record referral to compliance" : "Record decision";
      $("#dec-err").innerHTML = `<div class="msg bad">${esc(err.message)}</div>`;
      announce("The decision wasn't recorded: " + err.message);
    }
  };
}

/* ======================================================================
   Start
   ====================================================================== */
(async function start() {
  window.__pageLoads = (window.__pageLoads || 0) + 1;
  const params = new URLSearchParams(location.search);
  if (params.get("run")) { S.form.q = params.get("run"); history.replaceState(null, "", "/case#new"); }
  await loadConfig();
  await loadWatch();
  route();
})();
</script>
</body>
