<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Pre-Screen · ai·toolstack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A1D24; --ink2:#4A5160; --muted:#5B6270; --rule:#ECEAE5; --rule2:#DEDBD3;
  --paper:#FFFFFF; --bg:#F7F6F3; --accent:#8F5A0E; --amber:#E0A946;
  --clear:#2F6B45; --clear-bg:#EAF3EC;
  --flag:#8F5A0E; --flag-bg:#FBF1DF;
  --stop:#9B2C2C; --stop-bg:#FBEAEA;
  --unk:#4A5160; --unk-bg:#EEEDEA;
  --radius:10px;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Geist",system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
a{color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{background:var(--paper);border-bottom:1px solid var(--rule)}
header.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.brand svg{flex:none}
.brand small{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:12px}
.spacer{flex:1}
.badge{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:99px;border:1px solid var(--rule2);color:var(--ink2);background:var(--bg);white-space:nowrap}
.badge.live{border-color:#BFD9C7;color:var(--clear);background:var(--clear-bg)}
.badge.demo{border-color:#EED7AE;color:var(--accent);background:var(--flag-bg)}

h1{font-size:26px;letter-spacing:-.02em;margin:28px 0 4px}
.lede{color:var(--ink2);margin:0 0 18px;max-width:640px}

.card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);padding:18px}
.form-row{display:flex;gap:10px;flex-wrap:wrap}
input[type=text],textarea{font:inherit;color:var(--ink);border:1px solid var(--rule2);border-radius:8px;padding:10px 12px;background:#fff;width:100%}
input[type=text]:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber)}
.grow{flex:1 1 320px}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 16px;cursor:pointer}
button.ghost{background:#fff;color:var(--ink);border-color:var(--rule2);font-weight:500}
button:disabled{opacity:.5;cursor:wait}
details.more{margin-top:12px}
details.more summary{cursor:pointer;color:var(--ink2);font-size:14px}
.opt{display:grid;gap:10px;margin-top:10px}
label.small{font-size:13px;color:var(--ink2);display:block;margin-bottom:4px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink2)}

.msg{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--unk-bg);color:var(--ink2);font-size:14px}
.msg.err{background:var(--stop-bg);color:var(--stop)}
.cands{margin-top:12px;display:grid;gap:8px}
.cand{display:flex;gap:12px;align-items:center;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left;color:var(--ink);font-weight:400}
.cand:hover{border-color:var(--amber)}
.cand .num{font-family:var(--mono);font-size:13px;color:var(--ink2);min-width:84px}
.cand .nm{font-weight:600}
.cand .meta{font-size:13px;color:var(--muted)}
.pill{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:99px;background:var(--unk-bg);color:var(--ink2)}
.pill.active{background:var(--clear-bg);color:var(--clear)}
.pill.closed{background:var(--stop-bg);color:var(--stop)}
.pill.exact{background:var(--flag-bg);color:var(--accent)}

.demo-list{margin-top:14px;border-top:1px dashed var(--rule2);padding-top:12px}
.demo-list h3{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}

.progress{margin-top:18px;font-family:var(--mono);font-size:13px;color:var(--ink2)}
.progress div{padding:2px 0}
.progress div::before{content:"·  ";color:var(--amber)}

/* Report */
#report{margin:22px 0 60px}
.route{border-radius:var(--radius);padding:18px 20px;border:1px solid;display:grid;gap:6px}
.route.note{background:var(--clear-bg);border-color:#BFD9C7}
.route.refer{background:var(--flag-bg);border-color:#EED7AE}
.route.outside_appetite{background:var(--stop-bg);border-color:#EBC3C3}
.route .label{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.route.note .label{color:var(--clear)} .route.refer .label{color:var(--accent)} .route.outside_appetite .label{color:var(--stop)}
.route h2{margin:0;font-size:24px;letter-spacing:-.02em}
.route .co{color:var(--ink2);font-size:14px}
.route ul{margin:6px 0 0 18px;padding:0}
.route li{margin:2px 0}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.count{font-family:var(--mono);font-size:12.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--rule2);background:#fff}

.checks{margin-top:10px;background:#fff;border:1px solid var(--rule);border-radius:var(--radius)}
.row{display:grid;grid-template-columns:118px 1fr;gap:12px;padding:14px 16px;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.st{font-family:var(--mono);font-size:11.5px;font-weight:500;padding:4px 8px;border-radius:6px;height:fit-content;text-align:center;white-space:nowrap}
.st.clear{background:var(--clear-bg);color:var(--clear)}
.st.flag{background:var(--flag-bg);color:var(--accent)}
.st.flag.stop{background:var(--stop-bg);color:var(--stop)}
.st.couldnt_check{background:repeating-linear-gradient(135deg,var(--unk-bg) 0 6px,#E4E2DD 6px 12px);color:var(--ink)}
.st.not_applicable{background:#fff;color:var(--muted);border:1px dashed var(--rule2)}
.row h3{margin:0;font-size:15px}
.row .sum{color:var(--ink2);font-size:14px;margin-top:2px}
.finds{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:5px}
.finds li{font-size:14px;display:flex;gap:8px;align-items:baseline}
.tag{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:4px;flex:none;text-transform:uppercase;letter-spacing:.03em}
.tag.note{background:var(--unk-bg);color:var(--ink2)}
.tag.refer{background:var(--flag-bg);color:var(--accent)}
.tag.outside_appetite{background:var(--stop-bg);color:var(--stop)}
.srcs{margin-top:6px;font-size:12.5px;color:var(--muted)}
.srcs a{color:var(--muted)}

h2.sec{font-size:17px;margin:26px 0 8px;letter-spacing:-.01em}
.media{background:#fff;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.mi{padding:12px 16px;border-top:1px solid var(--rule);display:grid;gap:3px}
.mi:first-child{border-top:0}
.mi .t{font-weight:500}
.mi .m{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.mi .r{font-size:13.5px;color:var(--ink2)}
.mi.excluded{opacity:.62}
.about{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--unk-bg)}
.about.yes{background:var(--flag-bg);color:var(--accent)} .about.no{background:#fff;border:1px solid var(--rule2)}

.decision{display:grid;gap:12px}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choices label{border:1px solid var(--rule2);border-radius:8px;padding:8px 12px;cursor:pointer;display:flex;gap:6px;align-items:center;background:#fff}
.choices input:checked+span{font-weight:600}
.override{font-size:13.5px;color:var(--accent)}
.recorded{font-family:var(--mono);font-size:13px;color:var(--clear)}
.foot{margin-top:24px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

@media (max-width:640px){
  h1{font-size:22px}
  .row{grid-template-columns:1fr;gap:6px}
  .st{width:fit-content}
  .cand{flex-wrap:wrap}
  header.top small{display:none}
}
@media print{
  header.top,#search-card,.actions,.demo-list,#progress{display:none!important}
  body{background:#fff}
  .card,.checks,.media{border-color:#ccc}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="https://www.ai-toolstack.com/" aria-label="ai·toolstack">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="5" fill="#1A1D24"/><rect x="6" y="6" width="10" height="2.4" rx="1.2" fill="#E0A946"/><rect x="6" y="10" width="7" height="2.4" rx="1.2" fill="#fff"/><rect x="6" y="14" width="4" height="2.4" rx="1.2" fill="#fff"/></svg>
      ai·toolstack <small>/ company pre-screen</small>
    </a>
    <span class="spacer"></span>
    <span id="data-badge" class="badge">…</span>
  </div>
</header>

<main class="wrap">
  <h1>UK company pre-screen</h1>
  <p class="lede">For a commercial underwriter before quoting: what the public record says about this company, what couldn't be checked, and a recommended route. You decide.</p>

  <section class="card" id="search-card">
    <form id="search-form" class="form-row" autocomplete="off">
      <div class="grow">
        <label class="small" for="q">Company name or Companies House number</label>
        <input type="text" id="q" placeholder="e.g. 09446231 or Monzo Bank Limited" required>
      </div>
      <div style="align-self:flex-end"><button id="find-btn" type="submit">Find company</button></div>
    </form>
    <details class="more">
      <summary>From the proposal (optional)</summary>
      <div class="opt">
        <div>
          <label class="small" for="trade">Declared trade</label>
          <input type="text" id="trade" maxlength="300" placeholder="e.g. Commercial bakery with retail counter">
        </div>
        <label class="check"><input type="checkbox" id="fca"> This trade needs FCA authorisation</label>
      </div>
    </details>
    <div id="search-msg"></div>
    <div id="cands" class="cands"></div>
    <div id="demo" class="demo-list" hidden>
      <h3>Demo cases</h3>
      <div id="demo-cases" class="cands"></div>
    </div>
  </section>

  <div id="progress" class="progress" hidden></div>
  <section id="report" hidden></section>
</main>

<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ROUTE = {note:"Note only", refer:"Refer", outside_appetite:"Outside appetite"};
const STATUS = {clear:"Clear", flag:"Flag", couldnt_check:"Couldn't check", not_applicable:"Not applicable"};
const CLOSED = new Set(["dissolved","liquidation","administration","receivership","removed","closed","converted-closed","insolvency-proceedings","voluntary-arrangement"]);
let CONFIG = null, CURRENT = null;

async function api(path, opts={}) {
  const r = await fetch(path, {headers:{"Content-Type":"application/json"}, ...opts});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || `Request failed (${r.status})`);
  return body;
}

async function init() {
  try {
    CONFIG = await api("/api/prescreen/config");
    const b = $("#data-badge");
    b.textContent = CONFIG.data === "live" ? "Live data" : "Demo data";
    b.className = "badge " + CONFIG.data;
    if (CONFIG.demo_cases.length) {
      $("#demo").hidden = false;
      $("#demo-cases").innerHTML = CONFIG.demo_cases.map(c => `
        <button class="cand" type="button" data-num="${esc(c.company_number)}">
          <span class="num">${esc(c.company_number)}</span>
          <span><span class="nm">${esc(c.label.split(" — ")[0])}</span>
          <span class="meta"> — ${esc(c.label.split(" — ")[1] || "")}</span></span>
          <span class="spacer"></span><span class="pill ${c.kind === "real" ? "active" : ""}">${c.kind}</span>
        </button>`).join("");
      $("#demo-cases").onclick = e => { const b = e.target.closest("[data-num]"); if (b) runScreen(b.dataset.num); };
    }
  } catch (e) { $("#data-badge").textContent = "API offline"; }
}

$("#search-form").addEventListener("submit", async e => {
  e.preventDefault();
  const q = $("#q").value.trim();
  $("#cands").innerHTML = ""; $("#search-msg").innerHTML = "";
  $("#find-btn").disabled = true;
  try {
    const r = await api("/api/prescreen/search?q=" + encodeURIComponent(q));
    if (r.resolved) {
      $("#search-msg").innerHTML = r.message ? `<div class="msg">${esc(r.message)}</div>` : "";
      await runScreen(r.company_number);
    } else {
      $("#search-msg").innerHTML = `<div class="msg">${esc(r.message)}</div>`;
      $("#cands").innerHTML = r.candidates.map(c => `
        <button class="cand" type="button" data-num="${esc(c.company_number)}">
          <span class="num">${esc(c.company_number)}</span>
          <span><span class="nm">${esc(c.name)}</span><br>
          <span class="meta">${esc(c.address)}${c.date_of_creation ? " · inc. " + esc(c.date_of_creation) : ""}</span></span>
          <span class="spacer"></span>
          ${c.exact_name_match ? '<span class="pill exact">exact name</span>' : ""}
          <span class="pill ${c.status === "active" ? "active" : CLOSED.has(c.status) ? "closed" : ""}">${esc(c.status || "?")}</span>
        </button>`).join("");
    }
  } catch (err) {
    $("#search-msg").innerHTML = `<div class="msg err">${esc(err.message)}</div>`;
  } finally { $("#find-btn").disabled = false; }
});
$("#cands").onclick = e => { const b = e.target.closest("[data-num]"); if (b) runScreen(b.dataset.num); };

async function runScreen(number) {
  const prog = $("#progress");
  prog.hidden = false; $("#report").hidden = true;
  const steps = ["Companies House: profile, filings, officers, owners, charges", "Directors: disqualifications and other companies",
                 "UK Sanctions List: company, directors, owners", "FCA Register (if the trade is regulated)", "News and web: reading results"];
  prog.innerHTML = ""; let i = 0;
  const tick = setInterval(() => { if (i < steps.length) prog.insertAdjacentHTML("beforeend", `<div>${esc(steps[i++])}</div>`); }, 700);
  try {
    const report = await api("/api/prescreen", {method:"POST", body: JSON.stringify({
      company_number: number, declared_trade: $("#trade").value.trim(), expects_fca_authorisation: $("#fca").checked})});
    CURRENT = report;
    render(report);
  } catch (err) {
    $("#report").hidden = false;
    $("#report").innerHTML = `<div class="msg err">${esc(err.message)}</div>`;
  } finally { clearInterval(tick); prog.hidden = true; }
}

function srcLinks(sources) {
  if (!sources || !sources.length) return "";
  return `<div class="srcs">${sources.map(s => s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>` : esc(s.label)).join(" · ")}</div>`;
}

function render(r) {
  const counts = {clear:0, flag:0, couldnt_check:0, not_applicable:0};
  r.checks.forEach(c => counts[c.status]++);
  const chUrl = `https://find-and-update.company-information.service.gov.uk/company/${encodeURIComponent(r.company_number)}`;
  const reasons = r.route_reasons.length ? `<ul>${r.route_reasons.slice(0, 6).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "<div>No referral reasons found on the public record.</div>";
  const demoNote = r.meta && r.meta.data === "demo" ? `<div class="msg">Demo data: ${esc(r.meta.case_label || "")}</div>` : "";

  const rows = r.checks.map(c => {
    const stop = c.findings.some(f => f.route === "outside_appetite");
    const finds = c.findings.length ? `<ul class="finds">${c.findings.map(f => `
        <li><span class="tag ${f.route}">${esc(ROUTE[f.route])}</span><span>${esc(f.text)}${
          f.sources && f.sources[0] && f.sources[0].url ? ` <a href="${esc(f.sources[0].url)}" target="_blank" rel="noopener">source</a>` : ""}</span></li>`).join("")}</ul>` : "";
    return `<div class="row">
      <div><span class="st ${c.status}${stop ? " stop" : ""}">${STATUS[c.status]}</span></div>
      <div><h3>${esc(c.title)}</h3><div class="sum">${esc(c.status === "flag" ? "" : c.summary)}</div>${finds}${srcLinks(c.sources)}</div>
    </div>`;
  }).join("");

  const media = (r.media || []).map(m => `
    <div class="mi ${m.about_this_company === "no" ? "excluded" : ""}">
      <div class="t"><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a></div>
      <div class="m">${esc(m.source)} · ${esc((m.published || "").slice(0,10) || "undated")} ·
        <span class="about ${m.about_this_company}">about this company: ${esc(m.about_this_company)}</span>
        ${m.category && m.category !== "neutral" ? " · " + esc(m.category.replace(/_/g, " ")) + " · " + esc(m.severity) : ""}</div>
      ${m.reason ? `<div class="r">${esc(m.reason)}</div>` : ""}
    </div>`).join("");

  $("#report").innerHTML = `
    ${demoNote}
    <div class="route ${r.route}">
      <span class="label">Recommended route</span>
      <h2>${ROUTE[r.route]}</h2>
      <div class="co"><strong>${esc(r.company_name)}</strong> · <a href="${chUrl}" target="_blank" rel="noopener">${esc(r.company_number)}</a></div>
      ${reasons}
    </div>
    <div class="counts">
      <span class="count">${counts.clear} clear</span><span class="count">${counts.flag} flagged</span>
      <span class="count">${counts.couldnt_check} couldn't check</span><span class="count">${counts.not_applicable} not applicable</span>
    </div>
    <div class="checks">${rows}</div>
    ${media ? `<h2 class="sec">News and web results</h2><div class="media">${media}</div>` : ""}
    <h2 class="sec">Your decision</h2>
    <form class="card decision" id="decision-form">
      <div class="choices">
        <label><input type="radio" name="d" value="proceed" required><span>Proceed to quote</span></label>
        <label><input type="radio" name="d" value="refer"><span>Refer</span></label>
        <label><input type="radio" name="d" value="decline"><span>Decline</span></label>
      </div>
      <div id="override" class="override" hidden></div>
      <div><label class="small" for="reason">Reason (kept with the report)</label>
        <textarea id="reason" rows="3" minlength="5" required placeholder="e.g. Charges are mainstream bank debt; broker confirmed loss payee."></textarea></div>
      <div class="form-row"><div class="grow"><label class="small" for="uw">Your name</label><input type="text" id="uw" maxlength="120"></div>
        <div style="align-self:flex-end"><button type="submit">Record decision</button></div></div>
      <div id="recorded"></div>
    </form>
    <div class="actions"><button class="ghost" type="button" onclick="window.print()">Print / save as PDF</button>
      <button class="ghost" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'});document.getElementById('q').focus()">New pre-screen</button></div>
    <div class="foot">
      <span>Report ${esc(r.report_id)} · ${new Date(r.created_at).toLocaleString("en-GB")} · ${esc(r.elapsed_seconds)}s · ${r.llm_calls} model call(s)</span>
      <span>Rules ${esc(r.rules_version)} · recommendation only</span>
    </div>`;
  $("#report").hidden = false;
  $("#report").scrollIntoView({behavior:"smooth", block:"start"});

  const map = {proceed:"note", refer:"refer", decline:"outside_appetite"};
  $("#decision-form").addEventListener("change", () => {
    const v = ($("#decision-form").querySelector("input[name=d]:checked") || {}).value;
    const differs = v && map[v] !== r.route;
    $("#override").hidden = !differs;
    $("#override").textContent = differs ? `This differs from the recommendation (${ROUTE[r.route]}). Say why in the reason.` : "";
  });
  $("#decision-form").addEventListener("submit", async e => {
    e.preventDefault();
    const v = $("#decision-form").querySelector("input[name=d]:checked").value;
    try {
      const d = await api(`/api/prescreen/${r.report_id}/decision`, {method:"POST", body: JSON.stringify({
        decision: v, reason: $("#reason").value.trim(), underwriter: $("#uw").value.trim(), overrides_route: map[v] !== r.route})});
      $("#recorded").innerHTML = `<div class="recorded">Recorded ${esc(new Date(d.recorded_at).toLocaleString("en-GB"))}: ${esc(d.decision)}${d.overrides_route ? " (overrides recommendation)" : ""}.</div>`;
    } catch (err) { $("#recorded").innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
  });
}
init();
</script>
</body>
</html>
