<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Company Pre-Screen · ai·toolstack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/*
  Layout: an underwriter's workbench.
  Case header (who is this) -> main column (what we found, worst first, then everything we looked at)
  beside a sticky "Next steps" rail (questions, decision, watch).
  The signature element is the coverage ledger: every check, under the five questions an underwriter
  asks, with its outcome, so "couldn't check" is as visible as a flag.
*/
:root{
  --bg:#EEF0EC;        /* cool ledger paper, not cream */
  --paper:#FFFFFF;
  --wash:#F6F7F4;
  --ink:#1A1D24;       /* ai·toolstack ink */
  --ink2:#454B57;
  --muted:#6A707B;
  --rule:#E1E3DE;
  --rule2:#CDD0C9;
  --accent:#8F5A0E;    /* ai·toolstack bronze: links and focus */
  --amber:#E0A946;     /* ai·toolstack amber */

  /* Routes. Note only is neutral on purpose: a pre-screen can't say "safe". */
  --note:#5B6270;   --note-bg:#EEF0EC;  --note-line:#D5D8D1;
  --refer:#8A5A0B;  --refer-bg:#FBF0DA; --refer-line:#EBCF96; --refer-fill:#E0A946;
  --out:#A3302B;    --out-bg:#FBE9E7;   --out-line:#EDBDB8;   --out-fill:#C9473F;
  --hold:#17191E;   --hold-bg:#17191E;
  --gap:#7A7F88;    /* couldn't check */
  --live:#2F6B45;   --live-bg:#E7F2EA;

  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ico{display:inline-block;width:14px;height:14px;vertical-align:-2px;flex:none}
h1,h2,h3{text-wrap:balance}

/* ---------- Top bar ---------- */
.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
.top .in{max-width:1320px;margin:0 auto;height:56px;display:flex;align-items:center;gap:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;white-space:nowrap}
.brand b{font-weight:700;letter-spacing:-.01em}
.brand span{color:#AEB3BC;font-weight:400}
.qsearch{flex:1;max-width:460px;display:flex;gap:6px;margin-left:auto}
.qsearch input{flex:1;min-width:0;font:inherit;font-size:14px;border-radius:8px;border:1px solid #3A3F49;background:#262A33;color:#fff;padding:7px 11px}
.qsearch input::placeholder{color:#8B919B}
.qsearch button{border:0;border-radius:8px;background:var(--amber);color:var(--ink);font-weight:600;padding:7px 14px;font-size:14px}
.badge{font-size:12px;padding:3px 9px;border-radius:99px;white-space:nowrap;border:1px solid #3A3F49;color:#C9CDD4;margin-left:auto}
.qsearch:not([hidden])+.badge{margin-left:0}
.badge.demo{border-color:var(--amber);color:var(--amber)}
.badge.live{border-color:#6FBF8B;color:#9BE0B2}
.pv{background:var(--accent);color:#fff;font-size:13px;padding-block:7px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.wrap{max-width:1320px;margin:0 auto;padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Generic pieces ---------- */
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);min-width:0}
.panel>header{padding:13px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>header h2{font-size:15px;margin:0;font-weight:600;letter-spacing:-.01em}
.panel>header .aside{margin-left:auto;font-size:13px;color:var(--muted)}
.panel>.body{padding:16px 18px}
.btn{border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:9px 15px;font-weight:600;font-size:14px}
.btn.quiet{background:var(--paper);color:var(--ink);border-color:var(--rule2);font-weight:500}
.btn.small{padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
label.lb{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px;font-weight:500}
.hint{font-size:12.5px;color:var(--muted)}
input[type=text],textarea{font:inherit;color:var(--ink);border:1px solid var(--rule2);border-radius:8px;padding:9px 11px;background:#fff;width:100%}
textarea{resize:vertical}
.field{display:grid;gap:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule2);border-radius:99px;padding:4px 11px;font-size:13px;background:#fff;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink2)}
.msg{padding:10px 13px;border-radius:8px;background:var(--wash);border:1px solid var(--rule);color:var(--ink2);font-size:14px}
.msg.err{background:var(--out-bg);border-color:var(--out-line);color:var(--out)}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--wash);border:1px solid var(--rule);color:var(--ink2);white-space:nowrap}
.pill.active{background:var(--live-bg);border-color:#C3DFCB;color:var(--live)}
.pill.closed{background:var(--out-bg);border-color:var(--out-line);color:var(--out)}
.pill.exact{background:var(--refer-bg);border-color:var(--refer-line);color:var(--refer)}

/* Route tags: colour + shape, never colour alone */
.rt{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px 2px 7px;border-radius:6px;white-space:nowrap}
.rt .ico{width:12px;height:12px}
.rt.note{background:var(--note-bg);color:var(--note)}
.rt.refer{background:var(--refer-bg);color:var(--refer)}
.rt.outside_appetite{background:var(--out-bg);color:var(--out)}
.rt.compliance_hold{background:var(--hold);color:#fff}
.rt.gap{background:var(--wash);color:var(--gap);border:1px dashed var(--rule2)}
.fraud{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--out-line);color:var(--out);background:#fff;white-space:nowrap;margin-left:6px;vertical-align:1px}
.fraud .ico{width:11px;height:11px}

/* ---------- Start: the desk ---------- */
.desk{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.newcase .body{display:grid;gap:16px}
.newcase h1{font-size:28px;line-height:1.15;letter-spacing:-.025em;margin:0}
.newcase .lede{margin:0;color:var(--ink2);max-width:58ch}
.bigsearch{display:flex;gap:8px}
.bigsearch input{font-size:17px;padding:12px 14px}
.bigsearch .btn{padding:12px 18px;font-size:15px;white-space:nowrap}
.fromprop{border-top:1px solid var(--rule);padding-top:14px;display:grid;gap:12px}
.rail .fromprop{border-top:0;padding-top:12px}
.fromprop .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fromprop h3{font-size:14px;margin:0}
.cands{display:grid;gap:6px}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:#fff}
.cand:hover{border-color:var(--amber)}
.cand .nm{font-weight:600}
.cand .mt{font-size:13px;color:var(--muted);grid-column:1/-1}
.sources{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sources div{font-size:13px;color:var(--ink2);border-left:2px solid var(--rule2);padding-left:10px}
.sources b{display:block;color:var(--ink);font-size:13.5px}
.deskside{display:grid;gap:20px;min-width:0}
.chg{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;padding:11px 18px;border-top:1px solid var(--rule);font-size:14px;align-items:start}
.panel>header+.chg{border-top:0}
.chg .who{font-weight:600}
.chg .m{font-size:12.5px;color:var(--muted)}
.chg.seen{opacity:.6}
.chg button{border:0;background:none;color:var(--accent);padding:0;font-size:13px}
.empty{padding:14px 18px;font-size:14px;color:var(--muted)}
table.cases{width:100%;border-collapse:collapse;font-size:14px}
table.cases th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:9px 18px;border-bottom:1px solid var(--rule)}
table.cases td{padding:10px 18px;white-space:nowrap;border-bottom:1px solid var(--rule);vertical-align:middle}
table.cases tr:last-child td{border-bottom:0}
table.cases tr[data-id]{cursor:pointer}
table.cases tr[data-id]:hover td{background:var(--wash)}
table.cases tr.old td{color:var(--muted)}
table.cases tr.old .rt{opacity:.6}
.wb{font-size:11.5px;padding:1px 7px;border-radius:99px;border:1px solid var(--rule2);color:var(--ink2);margin-left:6px;white-space:nowrap}
.wb.new{background:var(--ink);border-color:var(--ink);color:#fff}
.tablewrap{overflow-x:auto}

/* ---------- Case header ---------- */
.casehead{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px;align-items:start;margin-bottom:20px}
.casehead>*{min-width:0}
.casehead h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.03em;font-weight:700}
.casehead .ids{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px;font-size:14px;color:var(--ink2)}
.casehead .ids a.mono{font-weight:500}
.casehead .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#watch-btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.facts{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;border-top:1px solid var(--rule);padding-top:14px;margin:0}
.facts dt{font-size:12.5px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-size:14px;min-width:0}
.confirm{grid-column:1/-1;font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.confirm .ico{color:var(--accent)}
.demo-note{font-size:13px;color:var(--accent);margin-bottom:12px}

.case{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.maincol{display:grid;gap:20px;min-width:0}
.maincol>*{min-width:0}
.rail{display:grid;gap:16px;min-width:0;align-content:start}

/* ---------- Verdict ---------- */
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;padding:20px;border-radius:var(--r);border:1px solid var(--rule);background:var(--paper)}
.stamp{align-self:start;width:200px;border:2px solid currentColor;border-radius:8px;padding:12px 14px;display:grid;gap:6px;align-content:start;outline:1px solid currentColor;outline-offset:3px}
.stamp .k{font-size:12.5px;font-weight:500;opacity:.85}
.stamp .v{font-size:23px;overflow-wrap:anywhere;font-weight:800;line-height:1.05;letter-spacing:-.02em;display:flex;gap:8px;align-items:flex-start}
.stamp .v .ico{width:22px;height:22px;margin-top:2px}
.stamp .rules{font-size:11.5px;opacity:.75;font-family:var(--mono)}
.verdict.note .stamp{color:var(--note)}
.verdict.refer .stamp{color:var(--refer);background:var(--refer-bg)}
.verdict.outside_appetite .stamp{color:var(--out);background:var(--out-bg)}
.verdict.compliance_hold{background:var(--hold-bg);border-color:var(--hold-bg);color:#fff;--hold-knock:var(--hold)}
.verdict.compliance_hold .stamp{color:#fff}
.verdict .why h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
.verdict .why p{margin:0 0 10px;color:var(--ink2)}
.verdict.compliance_hold .why p,.verdict.compliance_hold .why ol{color:#E4E6EA}
.verdict ol{margin:0;padding-left:20px;display:grid;gap:6px}
.verdict ol a{color:inherit;text-decoration:none}
.verdict ol a:hover{text-decoration:underline}
.verdict ol li:first-child{font-weight:600}
.verdict .pdiff{margin-top:10px;font-size:14px;display:flex;gap:8px;align-items:flex-start;color:var(--refer)}
.verdict.compliance_hold .pdiff{color:var(--amber)}
.verdict .pdiff a{color:inherit}
.verdict.compliance_hold ol a{text-decoration-color:rgba(255,255,255,.35)}
.verdict .clean{font-size:14px;color:var(--ink2)}

/* ---------- Coverage ledger (signature) ---------- */
.ledger .body{padding:0}
.lgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.lcol{border-left:1px solid var(--rule);padding:14px 14px 16px;min-width:0}
.lcol:first-child{border-left:0}
.lcol h3{font-size:13.5px;margin:0;font-weight:600;letter-spacing:-.005em}
.lcol .q{font-size:12px;color:var(--muted);margin:2px 0 10px;min-height:32px}
.lcell{display:grid;grid-template-columns:16px minmax(0,1fr);gap:7px;align-items:start;padding:5px 6px;margin:0 -6px;border-radius:6px;font-size:13px;text-decoration:none;color:var(--ink)}
.lcell:hover{background:var(--wash)}
.lcell .ico{margin-top:2px}
.lcell .st{display:block;font-size:11.5px;color:var(--muted)}
.lcell.flag .st{font-weight:600}
.lcell.flag.refer .ico,.lcell.flag.refer .st{color:var(--refer)}
.lcell.flag.outside_appetite .ico,.lcell.flag.outside_appetite .st{color:var(--out)}
.lcell.flag.compliance_hold .ico,.lcell.flag.compliance_hold .st{color:var(--hold)}
.lcell.couldnt_check{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(122,127,136,.11) 6px 12px)}
.lcell.couldnt_check .ico,.lcell.couldnt_check .st{color:var(--gap)}
.lcell.clear .ico,.lcell.info .ico{color:var(--note)}
.lcell.not_applicable{color:var(--muted)}
.lfoot{display:flex;flex-wrap:wrap;gap:6px 18px;padding:11px 18px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink2);background:var(--wash);border-radius:0 0 var(--r) var(--r)}
.lfoot span{display:inline-flex;gap:6px;align-items:center}
.lfoot b{font-variant-numeric:tabular-nums}

/* ---------- Attention cards ---------- */
.sech{display:flex;align-items:baseline;gap:10px;margin:4px 2px -8px}
.sech h2{font-size:17px;margin:0;letter-spacing:-.015em}
.sech .ct{font-size:13px;color:var(--muted)}
.cards{display:grid;gap:10px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:14px 18px;display:grid;gap:9px;scroll-margin-top:90px;position:relative}
.card::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--rule2)}
.card.refer::before{background:var(--refer-fill)}
.card.outside_appetite::before{background:var(--out-fill)}
.card.compliance_hold::before{background:var(--hold)}
.card.couldnt_check{background:linear-gradient(90deg,var(--wash),var(--paper) 45%)}
.card.couldnt_check::before{background:repeating-linear-gradient(180deg,var(--gap) 0 4px,transparent 4px 7px)}
.card.target{box-shadow:0 0 0 3px var(--amber)}
.card .ch{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.card h3{margin:0;font-size:15.5px;letter-spacing:-.01em}
.card .grp{font-size:12.5px;color:var(--muted);margin-left:auto}
.crit{font-size:12px;color:var(--ink2);border:1px solid var(--rule2);padding:0 7px;border-radius:99px}
.cwhy{font-size:14px;color:var(--ink2)}
.finds{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.finds li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:14.5px;align-items:baseline}
.srcs{font-size:12.5px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.srcs a{color:var(--muted)}

/* ---------- Proposal vs record ---------- */
table.pvr{width:100%;border-collapse:collapse;font-size:14px}
table.pvr th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:9px 18px;border-bottom:1px solid var(--rule)}
table.pvr td{padding:11px 18px;border-bottom:1px solid var(--rule);vertical-align:top}
table.pvr tr:last-child td{border-bottom:0}
table.pvr td.item{font-weight:600;white-space:nowrap}
table.pvr .n{display:block;font-size:13px;color:var(--ink2);margin-top:3px}
table.pvr td.v{white-space:nowrap;font-size:13px;font-weight:600}
.v.differs{color:var(--refer)} .v.match{color:var(--note)} .v.not_given,.v.unknown{color:var(--muted);font-weight:400}

/* ---------- Groups ---------- */
details.rest>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:10px;margin:4px 2px 0;padding:6px 0}
details.rest>summary::-webkit-details-marker{display:none}
details.rest>summary h2{font-size:17px;margin:0;letter-spacing:-.015em}
details.rest>summary .ct{font-size:13px;color:var(--muted)}
details.rest>summary::after{content:"Show";margin-left:auto;font-size:13px;color:var(--accent);font-weight:500}
details.rest[open]>summary::after{content:"Hide"}
details.rest>.groups{margin-top:12px}
.groups{display:grid;gap:12px}
.gsec{scroll-margin-top:90px}
.gsec>header .aside{font-size:12.5px}
.grow{display:grid;grid-template-columns:18px minmax(0,1fr);gap:9px;padding:10px 18px;border-top:1px solid var(--rule);font-size:14px;scroll-margin-top:90px}
.panel>header+.grow{border-top:0}
/* Agent review */
.agents .intro{font-size:13.5px;color:var(--muted);margin:0 0 12px;max-width:68ch}
.agents .plan{font-size:13.5px;margin:0 0 4px}
.agents .plan .not{color:var(--muted)}
.asec{border-top:1px solid var(--rule);padding:14px 18px}
.asec h3{font-size:14px;margin:0 0 4px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.asec .by{font-size:12px;color:var(--muted);font-weight:400}
.asec .txt{white-space:pre-wrap;font-size:14px;line-height:1.55;margin:6px 0 0;max-width:72ch}
.asec .txt.email{font-family:var(--mono);font-size:13px;background:var(--wash);border:1px solid var(--rule);border-radius:8px;padding:12px}
.chip{font-size:11.5px;border-radius:999px;padding:2px 8px;border:1px solid var(--rule);color:var(--muted);font-weight:500}
.chip.ok{color:var(--live);background:var(--live-bg);border-color:transparent}
.chip.blocked{color:var(--out);background:var(--out-bg);border-color:var(--out-line)}
.chip.error{color:var(--refer);background:var(--refer-bg);border-color:var(--refer-line)}
.asec .withheld{font-size:13.5px;color:var(--out);margin:6px 0 0}
.tracebar{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);padding:12px 18px;border-top:1px solid var(--rule);font-family:var(--mono)}
.tracebar b{color:var(--ink);font-weight:500}
.spans{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono)}
.spans td,.spans th{padding:4px 8px;border-top:1px solid var(--rule);text-align:left;white-space:nowrap}
.spans th{font-weight:500;color:var(--muted)}
.spans tr.bad td{color:var(--out)}
.agents details.tr{padding:0 18px 14px}
.agents details.tr summary{cursor:pointer;font-size:13px;color:var(--accent);padding:4px 0}
.grow b{font-weight:600}
.grow .s{color:var(--ink2)}
.grow .up{font-size:13px;margin-left:6px}
.grow.na{color:var(--muted)}
.grow .srcs{margin-top:2px}

/* ---------- Timeline ---------- */
.tl{list-style:none;margin:0;padding:8px 18px 14px}
.tl li{display:grid;grid-template-columns:96px 16px minmax(0,1fr);gap:10px;align-items:start;padding:7px 0;font-size:14px;position:relative}
.tl li .d{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:1px;font-variant-numeric:tabular-nums}
.tl li .dot{width:10px;height:10px;border-radius:50%;margin:5px 0 0 3px;background:var(--rule2);box-shadow:0 0 0 3px var(--paper);position:relative;z-index:1}
.tl li.watch .dot{background:var(--refer-fill)}
.tl li.serious .dot{background:var(--out-fill)}
.tl li::before{content:"";position:absolute;left:114px;top:0;bottom:0;width:1px;background:var(--rule)}
.tl li:first-child::before{top:12px}
.tl li:last-child::before{bottom:calc(100% - 12px)}
.tl .k{font-size:12px;color:var(--muted);margin-left:8px}

/* ---------- News ---------- */
.news h4{margin:0;padding:9px 18px;font-size:13px;color:var(--ink2);background:var(--wash);border-bottom:1px solid var(--rule);border-top:1px solid var(--rule)}
.news header+h4{border-top:0}
.ni{padding:11px 18px;border-bottom:1px solid var(--rule);display:grid;gap:3px}
.ni:last-child{border-bottom:0}
.ni .t{font-weight:500}
.ni .m{font-size:12.5px;color:var(--muted)}
.ni .r{font-size:14px;color:var(--ink2)}
.ni.set-aside .t a{color:var(--ink2)}
.sev{font-size:12px;padding:1px 7px;border-radius:99px;margin-left:6px;font-weight:600}
.sev.high{background:var(--out-bg);color:var(--out)} .sev.medium{background:var(--refer-bg);color:var(--refer)}

/* ---------- Rail: next steps ---------- */
.rail .panel>header{padding:11px 16px}
.rail .panel>.body{padding:14px 16px}
.qs{margin:0;padding:10px 16px 14px 34px;display:grid;gap:11px}
.qs li{font-size:14px}
.qs .bc{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.compl{margin:12px 16px 0;font-size:13px;color:#fff;background:var(--hold);border-radius:8px;padding:9px 11px;display:flex;gap:8px;align-items:flex-start;--hold-knock:var(--hold)}
.compl .ico{margin-top:2px;color:#fff}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.choices label{border:1px solid var(--rule2);border-radius:8px;padding:8px 6px;text-align:center;font-size:14px;background:#fff;cursor:pointer}
.choices input{position:absolute;opacity:0;pointer-events:none}
.choices label:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.choices label:has(input:focus-visible){outline:2px solid var(--amber)}
.override{font-size:13px;color:var(--refer)}
.recorded{font-size:13px;color:var(--ink2)}
.stack{display:grid;gap:12px}
.row2{display:flex;gap:8px}
.row2>.grow1{flex:1;min-width:0}
.watchrow{display:flex;align-items:flex-start;gap:12px}
.switch{position:relative;width:38px;height:22px;border-radius:99px;border:1px solid var(--rule2);background:var(--bg);padding:0;flex:none;margin-top:1px}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(26,29,36,.3);transition:left .15s}
.switch[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.switch[aria-checked="true"]::after{left:18px}
.desk-prop{border-top:1px solid var(--rule);padding-top:12px}
.desk-prop>summary::after{content:"Optional"!important;color:var(--muted)!important}
.desk-prop .fromprop>h3{display:none}
details.prop>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;font-weight:600;font-size:15px}
details.prop>summary::-webkit-details-marker{display:none}
details.prop>summary::after{content:"Edit";margin-left:auto;font-weight:500;font-size:13px;color:var(--accent)}
details.prop[open]>summary::after{content:"Close"}
.propsum{font-size:13px;color:var(--ink2);margin-top:4px}

.foot{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;border-top:1px solid var(--rule2);padding-top:12px}

/* ---------- Progress ---------- */
.prog ol{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.prog li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14.5px}
.prog .ic{width:16px;height:16px;border-radius:50%;border:2px solid var(--rule2)}
.prog .start .ic{border-color:var(--amber);border-top-color:transparent;animation:spin .8s linear infinite}
.prog .done .ic{background:var(--ink2);border-color:var(--ink2)}
.prog .error .ic{background:var(--out-fill);border-color:var(--out-fill)}
.prog .skip .ic{border-style:dashed}
.prog .dt{font-size:13px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.prog .start .ic{animation:none}.switch::after{transition:none}}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .case{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;overflow:visible}
  .lgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .lcol:nth-child(4){border-left:0}
  .lcol:nth-child(n+4){border-top:1px solid var(--rule)}
}
@media (max-width:860px){
  .desk{grid-template-columns:minmax(0,1fr)}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .casehead{grid-template-columns:minmax(0,1fr)}
  .casehead .acts{justify-content:flex-start}
  .verdict{grid-template-columns:minmax(0,1fr)}
  .stamp{width:auto}
  .sources{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .qsearch{display:none}
  table.cases th:nth-child(4),table.cases td:nth-child(4){display:none}
  table.cases td{white-space:normal}
  .brand span{display:none}
  .casehead h1{font-size:24px}
  .facts{grid-template-columns:minmax(0,1fr)}
  .lgrid{grid-template-columns:minmax(0,1fr)}
  .lcol{border-left:0;border-top:1px solid var(--rule)}
  .lcol:first-child{border-top:0}
  .lcol .q{min-height:0}
  .fromprop .two{grid-template-columns:minmax(0,1fr)}
  .bigsearch{flex-direction:column}
  table.pvr thead{display:none}
  table.pvr,table.pvr tbody,table.pvr tr,table.pvr td{display:block;width:100%}
  table.pvr tr{padding:11px 18px;border-bottom:1px solid var(--rule)}
  table.pvr tr:last-child{border-bottom:0}
  table.pvr td{padding:2px 0;border:0}
  table.pvr td:nth-child(2)::before{content:"Proposal: ";color:var(--muted)}
  table.pvr td:nth-child(3)::before{content:"Record: ";color:var(--muted)}
  .tl li{grid-template-columns:84px 16px minmax(0,1fr)}
  .tl li::before{left:102px}
  .card .grp{margin-left:0;width:100%}
}
@media print{
  .top,.qsearch,.rail .btn,.acts,.pv,.switch{display:none!important}
  .case{display:block} .rail{position:static;max-height:none}
  body{background:#fff}
}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <a class="brand" href="https://www.ai-toolstack.com/" aria-label="ai·toolstack home">
      <svg width="24" height="24" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="5" fill="#fff"/><rect x="6" y="6" width="10" height="2.4" rx="1.2" fill="#E0A946"/><rect x="6" y="10" width="7" height="2.4" rx="1.2" fill="#1A1D24"/><rect x="6" y="14" width="4" height="2.4" rx="1.2" fill="#1A1D24"/></svg>
      <b>Company Pre-Screen</b><span>by ai·toolstack</span>
    </a>
    <form class="qsearch" id="qsearch" autocomplete="off" hidden>
      <input type="text" id="q2" placeholder="Pre-screen another company" aria-label="Company name or number">
      <button type="submit">Find</button>
    </form>
    <span id="data-badge" class="badge">…</span>
  </div>
</header>

<div class="wrap">
  <div id="access" class="msg" hidden style="margin-bottom:16px">
    <div class="row2"><input class="grow1" type="text" id="access-code" placeholder="Access code" autocomplete="off"><button class="btn" type="button" id="access-btn">Use code</button></div>
  </div>
  <main id="main"></main>
</div>

<!-- One proposal form, moved between the start page and the report rail, so its values survive. -->
<div id="proposal-home" hidden>
  <div class="fromprop" id="proposal">
    <h3>From the broker's proposal <span class="hint">(optional, compared with the public record)</span></h3>
    <div class="field"><label class="lb" for="trade">Declared trade</label>
      <input type="text" id="trade" maxlength="300" placeholder="e.g. Commercial bakery, wholesale to cafes"></div>
    <div class="two">
      <div class="field"><label class="lb" for="turnover">Turnover (£)</label>
        <input type="text" id="turnover" inputmode="numeric" placeholder="e.g. 2,400,000"></div>
      <div class="field"><label class="lb" for="years">Years trading</label>
        <input type="text" id="years" inputmode="numeric" maxlength="3" placeholder="e.g. 12"></div>
    </div>
    <div class="field"><label class="lb" for="dirs">Directors named</label>
      <input type="text" id="dirs" maxlength="600" placeholder="e.g. Jane Smith, Ravi Patel"></div>
    <div class="field"><span class="lb">Cover being quoted</span>
      <div class="chips" id="lines">
        <button type="button" class="chip" data-v="property" aria-pressed="false">Property</button>
        <button type="button" class="chip" data-v="liability" aria-pressed="false">EL / PL</button>
        <button type="button" class="chip" data-v="professional_indemnity" aria-pressed="false">PI</button>
        <button type="button" class="chip" data-v="management_liability" aria-pressed="false">D&amp;O</button>
        <button type="button" class="chip" data-v="financial_institutions" aria-pressed="false">Financial institutions</button>
        <button type="button" class="chip" data-v="cyber" aria-pressed="false">Cyber</button>
        <button type="button" class="chip" data-v="motor_fleet" aria-pressed="false">Fleet</button>
      </div></div>
    <label class="toggle"><input type="checkbox" id="fca"> The trade needs FCA authorisation</label>
    <div id="rerun-row" hidden><button class="btn" type="button" id="rerun-btn">Run again with these details</button></div>
  </div>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u || "")) ? esc(u) : "#";
// Route names as an underwriter says them. "note" is the internal id; on screen it is "No referral".
const ROUTE = {note:"No referral", refer:"Refer", outside_appetite:"Outside appetite", compliance_hold:"Compliance hold"};
// The same ids on a single finding mean how much that finding alone weighs.
const FINDING = {note:"For the file", refer:"Refer", outside_appetite:"Outside appetite", compliance_hold:"Compliance"};
const ROUTE_LINE = {
  note: "Nothing in what was checked needs a referral. Read anything marked for the file, then quote as normal.",
  refer: "Needs an answer from the broker or a senior underwriter before you quote.",
  outside_appetite: "Decline, unless a senior underwriter overrides with reasons on file.",
  compliance_hold: "Potential sanctions match: the name and date of birth agree with a listed person. Don't quote, bind or pay, and don't tell the broker why. Compliance decides.",
};
const STATUS = {clear:"Nothing found", info:"Worth reading", flag:"Flag", couldnt_check:"Couldn't check", not_applicable:"Not applicable"};
const CLOSED = new Set(["dissolved","liquidation","administration","receivership","removed","closed","converted-closed","insolvency-proceedings","voluntary-arrangement"]);
const GROUPS = [
  {id: "identity", title: "Identity & ownership", question: "Is it who the proposal says, and who owns it?"},
  {id: "financial", title: "Financial standing", question: "Is it keeping up, or showing distress?"},
  {id: "management", title: "Management", question: "Who runs it, and what's their record?"},
  {id: "regulatory", title: "Regulatory & legal", question: "Is it allowed to do this? Is anyone acting against it?"},
  {id: "reputation", title: "Reputation", question: "What's being said about it in public?"},
];
const GTITLE = Object.fromEntries(GROUPS.map(g => [g.id, g.title]));
const VERDICT = {match: "Matches", differs: "Differs", not_given: "Not given", unknown: "Can't compare"};
const KIND = {company: "Company", people: "Directors", owners: "Owners", money: "Charges", filings: "Filings", legal: "Legal"};
const RANK = {note: 0, refer: 1, outside_appetite: 2, compliance_hold: 3};
let CONFIG = null, CURRENT = null, LAST_NUMBER = null, WATCHED = new Map();

/* Shapes: tick = nothing found / note, triangle = refer, octagon = outside appetite,
   bars = compliance hold, hatch = couldn't check, ring = worth reading, dash = not applicable. */
function icon(kind) {
  const p = {
    tick: '<path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
    tri: '<path d="M8 1.6l6.8 12H1.2z" fill="currentColor"/><path d="M8 6v3.6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".9" fill="#fff"/>',
    stop: '<path d="M5.2 1h5.6L15 5.2v5.6L10.8 15H5.2L1 10.8V5.2z" fill="currentColor"/><path d="M4.5 8h7" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>',
    hold: '<rect x="1" y="1" width="14" height="14" rx="2.5" fill="currentColor"/><path d="M5.6 4.6v6.8M10.4 4.6v6.8" stroke="var(--hold-knock,#fff)" stroke-width="2" stroke-linecap="round"/>',
    hatch: '<rect x="1.5" y="1.5" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-dasharray="2.2 1.6"/><path d="M4.5 11.5l7-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    ring: '<circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 7.2v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="4.8" r=".9" fill="currentColor"/>',
    dash: '<path d="M4 8h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    check: '<circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 8.2l2 2 4-4.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
  }[kind];
  return `<svg class="ico" viewBox="0 0 16 16" aria-hidden="true">${p}</svg>`;
}
const ROUTE_ICON = {note: "tick", refer: "tri", outside_appetite: "stop", compliance_hold: "hold"};
const worst = c => (c.findings || []).reduce((w, f) => RANK[f.route] > RANK[w] ? f.route : w, "note");
function checkIcon(c) {
  if (c.status === "flag") return ROUTE_ICON[worst(c)] || "tri";
  return {clear: "tick", info: "ring", couldnt_check: "hatch", not_applicable: "dash"}[c.status] || "dash";
}
const groupOf = c => c.group || "identity";
const routeTag = r => `<span class="rt ${esc(r)}">${icon(ROUTE_ICON[r])}${esc(ROUTE[r] || r)}</span>`;
const findingTag = r => `<span class="rt ${esc(r)}">${icon(r === "note" ? "ring" : ROUTE_ICON[r])}${esc(FINDING[r] || r)}</span>`;
// Source errors in words an underwriter can act on.
function humanReason(t) {
  const s = String(t || "").replace(/\.$/, "");
  if (/HTTP 5\d\d|unavailable|ReadTimeout|timed? ?out|ConnectError/i.test(s)) return s.replace(/^([^:]+):.*$/, "$1 didn't respond") + "; try again shortly";
  if (/rate limit|429/i.test(s)) return s.replace(/^([^:]+):.*$/, "$1 is busy") + "; try again in a few minutes";
  if (/no_key|not connected|paid source/i.test(s)) return s;
  return s;
}
const notCovered = c => c.check_id === "ccj" && /not connected|paid/i.test(c.not_checked_reason || c.summary || "");
const order = c => c.status === "flag" ? -RANK[worst(c)] - 1 : ({couldnt_check: 0, info: 1, clear: 2, not_applicable: 3}[c.status]);
function fmtDate(s) { if (!s) return ""; const d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString("en-GB", {day: "numeric", month: "short", year: "numeric"}); }
function yearsSince(s) { const d = new Date(s); if (isNaN(d)) return ""; const y = Math.floor((Date.now() - d) / 31557600000); return y < 1 ? "under a year" : `${y} year${y === 1 ? "" : "s"}`; }
async function copyText(btn, text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); } catch (e2) {} t.remove(); }
  const was = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = was; }, 1600);
}

/* ---------- API ---------- */
function code() { try { return sessionStorage.getItem("prescreen-code") || ""; } catch (e) { return ""; } }
async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {"Content-Type": "application/json", "X-Access-Token": code()}});
  const body = await r.json().catch(() => ({}));
  if (r.status === 401) { $("#access").hidden = false; throw new Error("Enter the access code to use this service."); }
  if (!r.ok) { const d = body.detail; throw new Error(Array.isArray(d) ? d.map(x => x.msg).join("; ") : (d || `Request failed (${r.status})`)); }
  return body;
}
$("#access-btn").onclick = () => { try { sessionStorage.setItem("prescreen-code", $("#access-code").value.trim()); } catch (e) {} $("#access").hidden = true; init(); };
async function loadWatched() {
  try { WATCHED = new Map((await api("/api/prescreen/watch")).map(w => [w.company_number, w])); } catch (e) { WATCHED = new Map(); }
}

/* ---------- Proposal form ---------- */
const PROP = $("#proposal");
$("#lines").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
  if (CURRENT) $("#rerun-row").hidden = false;
});
["trade", "turnover", "years", "dirs", "fca"].forEach(id => $("#" + id).addEventListener("input", () => { if (CURRENT) $("#rerun-row").hidden = false; }));
function proposal() {
  return {
    declared_trade: $("#trade").value.trim(),
    expects_fca_authorisation: $("#fca").checked,
    cover_lines: [...document.querySelectorAll("#lines .chip[aria-pressed=true]")].map(b => b.dataset.v),
    declared_turnover_gbp: (v => v ? Number(v) : null)($("#turnover").value.replace(/[^0-9]/g, "")),
    declared_years_trading: (v => v ? Number(v) : null)($("#years").value.replace(/[^0-9]/g, "")),
    declared_directors: $("#dirs").value.trim(),
  };
}
function setProposal(p) {
  $("#trade").value = p.declared_trade || "";
  $("#turnover").value = p.declared_turnover_gbp ? Number(p.declared_turnover_gbp).toLocaleString("en-GB") : "";
  $("#years").value = p.declared_years_trading ?? "";
  $("#dirs").value = p.declared_directors || "";
  $("#fca").checked = !!p.expects_fca_authorisation;
  document.querySelectorAll("#lines .chip").forEach(b => b.setAttribute("aria-pressed", (p.cover_lines || []).includes(b.dataset.v) ? "true" : "false"));
}
function proposalLines(p) {
  return (p.cover_lines || []).map(v => ({property:"Property", liability:"EL/PL", professional_indemnity:"PI", management_liability:"D&O", financial_institutions:"Financial institutions", cyber:"Cyber", motor_fleet:"Fleet"}[v] || v)).join(", ");
}
function proposalSummary(p) {
  const lines = (p.cover_lines || []).map(v => ({property:"Property", liability:"EL/PL", professional_indemnity:"PI", management_liability:"D&O", financial_institutions:"FI", cyber:"Cyber", motor_fleet:"Fleet"}[v] || v));
  const parts = [p.declared_trade, p.declared_turnover_gbp ? "£" + Number(p.declared_turnover_gbp).toLocaleString("en-GB") : "", lines.join(", ")].filter(Boolean);
  return parts.length ? parts.join("; ") : "No proposal details were given, so nothing was compared.";
}
$("#rerun-btn").onclick = () => { if (LAST_NUMBER) runScreen(LAST_NUMBER); };
function parkProposal() { $("#proposal-home").appendChild(PROP); }

/* ---------- Find ---------- */
async function find(q, msgEl, candEl) {
  msgEl.innerHTML = ""; candEl.innerHTML = "";
  try {
    const r = await api("/api/prescreen/search?q=" + encodeURIComponent(q));
    if (r.resolved) { await runScreen(r.company_number); return; }
    msgEl.innerHTML = `<div class="msg">${esc(r.message)}</div>`;
    candEl.innerHTML = r.candidates.map(c => `<button class="cand" type="button" data-num="${esc(c.company_number)}">
      <span class="nm">${esc(c.name)}</span>
      <span>${c.exact_name_match ? '<span class="pill exact">exact name</span> ' : ""}<span class="pill ${c.status === "active" ? "active" : CLOSED.has(c.status) ? "closed" : ""}">${esc((c.status || "?").replace(/-/g, " "))}</span></span>
      <span class="mt"><span class="mono">${esc(c.company_number)}</span>${c.date_of_creation ? ", incorporated " + esc(fmtDate(c.date_of_creation)) : ""}${c.address ? ", " + esc(c.address) : ""}</span></button>`).join("");
  } catch (err) { msgEl.innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
}
$("#qsearch").addEventListener("submit", e => {
  e.preventDefault(); const q = $("#q2").value.trim(); if (!q) return;
  $("#q2").value = ""; CURRENT = null; showStart(q);
});

/* ---------- Start: the desk ---------- */
async function init() {
  try {
    CONFIG = await api("/api/prescreen/config");
    const b = $("#data-badge");
    b.textContent = CONFIG.data === "live" ? "Live registers" : "Demo data";
    b.className = "badge " + CONFIG.data;
  } catch (e) { $("#data-badge").textContent = $("#access").hidden ? "Service offline" : "Access code needed"; return; }
  if (!CURRENT) showStart(); else loadWatched();
}

async function showStart(prefill) {
  $("#qsearch").hidden = true;
  let recent = [], changes = [];
  [recent, changes] = await Promise.all([
    api("/api/prescreen/recent").catch(() => []),
    api("/api/prescreen/changes?limit=40").catch(() => []),
    loadWatched(),
  ]);
  const demo = (CONFIG && CONFIG.demo_cases) || [];
  const byCo = new Map();
  changes.forEach(c => { if (!byCo.has(c.company_number)) byCo.set(c.company_number, []); byCo.get(c.company_number).push(c); });
  // Worst change first within a company, so a route change is never the one cut off.
  byCo.forEach(list => list.sort((a, b) => (RANK[b.severity] || 0) - (RANK[a.severity] || 0) || (b.kind === "route") - (a.kind === "route") || b.id - a.id));
  const cos = [...byCo.entries()].sort((a, b) => (a[1].some(x => !x.seen) ? 0 : 1) - (b[1].some(x => !x.seen) ? 0 : 1));
  const sevColour = s => ({refer: "var(--refer)", outside_appetite: "var(--out)", compliance_hold: "var(--hold)"}[s] || "var(--note)");
  // A newer report on the same company supersedes older ones: only the newest carries the watch badge.
  const newest = {};
  recent.forEach(c => { if (!newest[c.company_number] || c.created_at > newest[c.company_number]) newest[c.company_number] = c.created_at; });
  const superseded = c => c.created_at < newest[c.company_number];

/* ---------- Run with live progress ---------- */
async function runScreen(number) {
  LAST_NUMBER = number; $("#rerun-row").hidden = true;
  const p = proposal(); parkProposal();
  const started = Date.now();
  let stages = [];
  const state = {};
  const draw = () => {
    $("#main").innerHTML = `<section class="panel prog" style="max-width:640px"><header><h2>Pre-screening <span class="mono">${esc(number)}</span></h2>
      <span class="aside mono" id="elapsed">${((Date.now() - started) / 1000).toFixed(0)}s</span></header>
      <div class="body"><ol>${stages.map(s => { const st = state[s.id] || {}; return `<li class="${st.state || "wait"}"><span class="ic"></span>
        <span>${esc(s.label)}</span><span class="dt">${esc(st.state === "error" ? "couldn't reach" : st.state === "skip" ? (st.detail || "skipped") : (st.detail || ""))}</span></li>`; }).join("")}</ol></div></section>`;
  };
  draw();
  const timer = setInterval(() => { const el = $("#elapsed"); if (el) el.textContent = ((Date.now() - started) / 1000).toFixed(0) + "s"; }, 500);
  try {
    const r = await fetch("/api/prescreen/stream", {method: "POST", headers: {"Content-Type": "application/json", "X-Access-Token": code()},
      body: JSON.stringify({company_number: number, ...p})});
    if (r.status === 401) { $("#access").hidden = false; throw new Error("Enter the access code to use this service."); }
    if (!r.ok) { const b = await r.json().catch(() => ({})); const d = b.detail; throw new Error(Array.isArray(d) ? d.map(x => x.msg).join("; ") : (d || `Request failed (${r.status})`)); }
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "", report = null;
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1); if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "stages") { stages = ev.stages; draw(); }
        else if (ev.type === "progress") { state[ev.stage] = ev; draw(); }
        else if (ev.type === "error") throw new Error(ev.detail);
        else if (ev.type === "report") report = ev.report;
      }
    }
    if (!report) throw new Error("The pre-screen stopped before it finished. Run it again.");
    CURRENT = report; await loadWatched(); render(report);
  } catch (err) {
    $("#main").innerHTML = `<div class="msg err">${esc(err.message)}</div><p><button class="btn quiet" type="button" id="back-desk">Back to the desk</button></p>`;
    $("#back-desk").onclick = () => { CURRENT = null; showStart(); };
  } finally { clearInterval(timer); }
}

function anchorFor(reason, checks) {
  for (const c of checks) {
    if (reason.startsWith(c.title + " couldn't")) return c.check_id;

function render(r) {
  $("#qsearch").hidden = false;
  setProposal(r.request || {}); $("#rerun-row").hidden = true; parkProposal();
  const checks = r.checks;
  const attention = checks.filter(c => c.status === "flag" || (c.status === "couldnt_check" && !notCovered(c))).sort((a, b) => order(a) - order(b));
  const attentionIds = new Set(attention.map(c => c.check_id));
  const byGroup = GROUPS.map(g => ({...g, checks: checks.filter(c => groupOf(c) === g.id).sort((a, b) => order(a) - order(b))}));
  const reasons = r.route_reasons.slice(0, 6);
  const media = r.media || [];
  const about = media.filter(m => m.about_this_company === "yes" || m.about_this_company === "unsure");
  const aside = media.filter(m => m.about_this_company === "no");
  const unread = media.filter(m => m.about_this_company === "not_reviewed");
  const newsItem = (m, cls = "") => `<div class="ni ${cls}"><div class="t"><a href="${safeUrl(m.url)}" target="_blank" rel="noopener noreferrer">${esc(m.title)}</a>${
      m.severity && m.severity !== "low" && cls !== "set-aside" ? `<span class="sev ${esc(m.severity)}">${esc(m.severity)}</span>` : ""}</div>
    <div class="m">${esc(m.source)}, ${esc(fmtDate((m.published || "").slice(0, 10)) || "undated")}${m.category && m.category !== "neutral" ? ", " + esc(m.category.replace(/_/g, " ")) : ""}${m.about_this_company === "unsure" ? ", may not be this company" : ""}</div>
    ${m.reason ? `<div class="r">${esc(m.reason)}</div>` : ""}</div>`;
  const demo = r.meta && r.meta.data === "demo";
  const qs = r.broker_questions || [];
  const sanctionsHit = checks.some(c => c.findings.some(f => f.rule_id === "sanctions_strong" || f.rule_id === "sanctions_possible"));
  const pvr = r.proposal_vs_record || [];
  const pvrGiven = pvr.filter(x => x.verdict !== "not_given");
  const pdiff = pvr.filter(x => x.verdict === "differs");
  const pvrUnknown = pvrGiven.filter(x => x.verdict === "unknown").length;
  const gsum = cs => {
    const f = cs.filter(c => c.status === "flag").length, u = cs.filter(c => c.status === "couldnt_check").length, i = cs.filter(c => c.status === "info").length;
    const ran = cs.filter(c => c.status !== "not_applicable").length;
    return [f ? `${f} flagged` : "", u ? `${u} couldn't check` : "", i ? `${i} worth reading` : "", !f && !u && !i && ran ? "nothing found" : "", !ran ? "not applicable" : ""].filter(Boolean).join(", ");
  };
  const tl = r.timeline || [];

  $("#main").innerHTML = `
    ${demo ? `<div class="demo-note">Demo data: ${esc(r.meta.case_label || "")}</div>` : ""}
    ${r.meta && r.meta.source === "daily re-check" ? `<div class="msg" style="margin-bottom:16px;border-color:var(--refer-line);background:var(--refer-bg);color:var(--ink)"><b>Daily re-check of a watched company.</b> The route shows how this would be treated as new business today. If the policy is already bound, treat it as a mid-term review: check the policy conditions and note it for renewal. News wasn't re-read.</div>` : ""}
    ${r.meta && r.meta.not_saved ? `<div class="msg err" style="margin-bottom:16px">This report wasn't saved: ${esc(r.meta.not_saved)}. Copy the file note before you leave.</div>` : ""}
    ${renderCaseHead(r)}
    <div class="case">
      <div class="maincol">
        <section class="verdict ${esc(r.route)}">
          <div class="stamp"><span class="k">Recommended route</span><span class="v">${icon(ROUTE_ICON[r.route])}${esc(ROUTE[r.route])}</span><span class="rules">rules ${esc(r.rules_version)}</span></div>
          <div class="why"><h2>Why</h2><p>${esc(ROUTE_LINE[r.route])}</p>
            ${reasons.length ? `<ol>${reasons.map(x => { const id = anchorFor(x, checks); return `<li>${id ? `<a href="#c-${esc(id)}" data-jump="${esc(id)}">${esc(x)}</a>` : esc(x)}</li>`; }).join("")}</ol>`
              : `<div class="clean">${attention.length ? `${attention.length} check${attention.length === 1 ? "" : "s"} couldn't run; ${attention.length === 1 ? "it's" : "they're"} listed below.` : "Every check that applied found nothing that changes the route."}</div>`}
            ${pdiff.length ? `<div class="pdiff">${icon("tri")}<span>The proposal differs from the public record on ${esc(pdiff.map(x => x.item.toLowerCase()).join(", "))}. <a href="#pvr" data-jumpid="pvr">Check the presentation</a></span></div>` : ""}
          </div>
        </section>

${pvrGiven.length ? `<section class="panel" id="pvr" style="scroll-margin-top:90px"><header><h2>Proposal against the public record</h2><span class="aside">${[pdiff.length ? `${pdiff.length} differ${pdiff.length === 1 ? "s" : ""}` : "", pvrUnknown ? `can't compare ${pvrUnknown} of ${pvrGiven.length}` : "", !pdiff.length && !pvrUnknown ? "nothing differs" : ""].filter(Boolean).join(", ")}</span></header><div class="tablewrap"><table class="pvr">
          <thead><tr><th></th><th>Proposal says</th><th>Public record</th><th>Result</th></tr></thead><tbody>
          ${pvr.map(x => `<tr><td class="item">${esc(x.item)}</td><td>${esc(x.proposal)}</td><td>${esc(x.record)}${x.note ? `<span class="n">${esc(x.note)}</span>` : ""}</td>
            <td class="v ${esc(x.verdict)}">${x.verdict === "differs" ? icon("tri") + " " : x.verdict === "match" ? icon("tick") + " " : ""}${esc(VERDICT[x.verdict] || x.verdict)}</td></tr>`).join("")}
          </tbody></table></div></section>` : ""}

        ${renderLedger(r, byGroup)}

        ${attention.length ? `<div class="sech"><h2>Needs your attention</h2><span class="ct">${attention.length}</span></div><div class="cards">${attention.map(card).join("")}</div>` : ""}



        <details class="rest" id="rest"><summary><h2>Everything else we looked at</h2><span class="ct">${checks.length - attention.length} checks, by the question they answer</span></summary>
        <div class="groups">${byGroup.map(g => ({...g, rest: g.checks.filter(c => !attentionIds.has(c.check_id))})).filter(g => g.rest.length).map(g => `<section class="panel gsec" id="g-${g.id}"><header><h2>${esc(g.title)}</h2><span class="aside">${esc(gsum(g.checks))}</span></header>
          ${g.rest.map(c => groupRow(c, false)).join("")}</section>`).join("")}</div></details>

        ${tl.length ? `<section class="panel"><header><h2>What happened when</h2><span class="aside">last 5 years, Companies House and the Gazette</span></header>
          <ol class="tl">${tl.map(e => `<li class="${esc(e.tone)}"><span class="d">${esc(fmtDate(e.date))}</span><span class="dot" aria-hidden="true"></span>
            <span>${esc(e.text)}<span class="k">${esc(KIND[e.kind] || "")}</span></span></li>`).join("")}</ol></section>` : ""}

        ${media.length ? `<section class="panel news"><header><h2>News and web</h2><span class="aside">${media.length} result${media.length === 1 ? "" : "s"}, read against this company</span></header>
          ${about.length ? `<h4>About this company</h4>${about.map(m => newsItem(m)).join("")}` : ""}
          ${unread.length ? `<h4>Not reviewed</h4>${unread.map(m => newsItem(m)).join("")}` : ""}
          ${aside.length ? `<h4>Before this company took its name: probably a different business, but worth a look</h4>${aside.map(m => newsItem(m, "set-aside")).join("")}` : ""}
        </section>` : ""}

        <section class="panel agents" id="agent-review"><header><h2>Agent review</h2><span class="aside">specialist agents over the MCP server: they explain, the rules decide</span></header>
          <div id="agent-out"><div class="body"><span class="aside">Loading…</span></div></div></section>

        <div class="foot"><span>Report <span class="mono">${esc(r.report_id)}</span>, ${esc(new Date(r.created_at).toLocaleString("en-GB"))}, ${esc(r.elapsed_seconds)}s, ${r.llm_calls} model call${r.llm_calls === 1 ? "" : "s"}</span>
          <span>Rules ${esc(r.rules_version)}: draft thresholds. A recommendation only.</span></div>
      </div>
      <aside class="rail" id="rail">${renderRail(r, qs, sanctionsHit)}</aside>
    </div>`;

  $("#prop-rail").appendChild(PROP);
  placeRail();
  wireReport(r, qs);
  loadAgentRuns(r);
  window.scrollTo({top: 0});
}

// ---------------------------------------------------------------------------
// Agent review
// ---------------------------------------------------------------------------
const AGENT_INTRO = `<p class="intro">Agents read this case through the same MCP tools an outside client would use. They can't change the route or record a decision, and a guardrail checks everything they write before it shows here.</p>`;
const AGENT_NAME = {director_history: "Directors' other companies", news: "News", broker_email: "Email to the broker"};
async function loadAgentRuns(r) {
  const out = $("#agent-out"); if (!out) return;
  let runs = [], cfg = {};
  try { [runs, cfg] = await Promise.all([api(`/api/prescreen/${r.report_id}/agent-runs?limit=1`), api("/api/prescreen/agents/config")]); } catch (e) {}
  out.innerHTML = runs.length ? renderAgentRun(runs[0], cfg) : `<div class="body">${AGENT_INTRO}${agentButton(cfg)}</div>`;
  wireAgentButton(r, cfg);
}
function agentButton(cfg, again) {
  if (cfg && cfg.available === false) return `<p class="aside">Agents aren't set up on this server (no key for ${esc(cfg.model || "the model")}).</p>`;
  return `<div class="acts" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn ${again ? "quiet small" : ""}" id="agent-run">${again ? "Run again" : "Run agent review"}</button>
    <span class="aside" id="agent-msg">${again ? "" : `${esc(cfg.model || "")}, usually 20–60 seconds and under a cent`}</span></div>`;
}
function wireAgentButton(r, cfg) {
  const b = $("#agent-run"); if (!b) return;
  b.onclick = async () => {
    b.disabled = true; const m = $("#agent-msg"); if (m) m.textContent = "Agents are working. This takes 20–60 seconds…";
    try { const run = await api(`/api/prescreen/${r.report_id}/agent-review`, {method: "POST"}); $("#agent-out").innerHTML = renderAgentRun(run, cfg); wireAgentButton(r, cfg); }
    catch (e) { b.disabled = false; if (m) m.textContent = e.message; }
  };
  document.querySelectorAll(".copy-email").forEach(btn => btn.onclick = () => copyText(btn, btn.dataset.text));
}
function renderAgentRun(run, cfg) {
  const v = run.review || {}, plan = v.plan || {}, t = (run.trace || {}).totals || {};
  if (v.stopped) return `<div class="body"><p class="msg err">${esc(v.stopped)}</p>${agentButton(cfg, true)}</div>`;
  const ran = (plan.run || []).map(n => AGENT_NAME[n] || n);
  const notRun = Object.entries(plan.not_run || {}).concat(Object.entries(plan.dropped || {}));
  const secs = (v.sections || []).map(x => {
    const g = x.guardrail || {};
    const chip = x.status === "ok" ? `<span class="chip ok">${icon("tick")} checked: ${esc(g.checked_by || "rules")}</span>`
      : x.status === "blocked" ? `<span class="chip blocked">withheld by the guardrail</span>` : `<span class="chip error">didn't finish</span>`;
    const email = x.agent === "broker_email";
    return `<div class="asec"><h3>${esc(AGENT_NAME[x.agent] || x.title)} ${chip}${x.revisions ? `<span class="by">rewritten ${x.revisions}× after the guardrail blocked a draft</span>` : ""}</h3>
      <div class="by">${esc(x.agent)} agent, ${x.steps} tool call${x.steps === 1 ? "" : "s"}${email ? ", for the broker: read before sending" : ", internal"}</div>
      ${x.status === "ok" ? `<div class="txt ${email ? "email" : ""}">${esc(x.text)}</div>${email ? `<button class="btn quiet small copy-email" style="margin-top:8px" data-text="${esc(x.text)}">Copy email</button>` : ""}`
        : x.status === "blocked" ? `<p class="withheld">Not shown: ${esc(x.withheld_reason || "")}</p>` : `<p class="withheld">${esc(x.error || "")}</p>`}</div>`;
  }).join("");
  const spans = (run.trace || {}).spans || [];
  return `<div class="body">${AGENT_INTRO}<p class="plan">${ran.length ? `Ran: ${esc(ran.join(", "))}.` : "No specialist had anything to work on."} <span class="aside">Planned by ${esc(plan.planned_by || "rules")}.</span></p>
    ${notRun.length ? `<p class="plan not">${notRun.map(([n, why]) => `${esc(AGENT_NAME[n] || n)}: ${esc(why)}`).join("<br>")}</p>` : ""}
    <p class="plan not">Route unchanged: ${esc(ROUTE[v.route] || v.route)}. ${(v.couldnt_check || []).length} check${(v.couldnt_check || []).length === 1 ? "" : "s"} couldn't run and stay unchecked.</p>
    </div>${secs}
    <div class="tracebar"><span><b>${t.model_calls}</b> model calls</span><span><b>${t.tool_calls}</b> MCP tool calls</span><span><b>${(t.input_tokens || 0).toLocaleString("en-GB")}</b> in / <b>${(t.output_tokens || 0).toLocaleString("en-GB")}</b> out tokens</span>
      <span><b>$${(t.cost_usd || 0).toFixed(4)}</b></span><span><b>${((t.wall_ms || 0) / 1000).toFixed(1)}s</b></span><span>${esc(run.model)} · MCP ${esc(run.transport)}</span><span>${esc(new Date(run.created_at).toLocaleString("en-GB"))}</span></div>
    <details class="tr"><summary>Trace: every call, in order</summary><div class="tablewrap"><table class="spans"><thead><tr><th>#</th><th>agent</th><th>kind</th><th>call</th><th>ms</th><th>tokens in/out</th><th>$</th><th></th></tr></thead><tbody>
    ${spans.map(sp => `<tr class="${sp.ok === false || sp.passed === false ? "bad" : ""}"><td>${sp.seq}</td><td>${esc(sp.agent)}</td><td>${esc(sp.kind)}</td><td>${esc(sp.name)}</td><td>${sp.ms}</td>
      <td>${sp.kind === "model" ? `${sp.input_tokens || 0}/${sp.output_tokens || 0}` : sp.bytes ? `${sp.bytes} B` : ""}</td><td>${sp.cost_usd ? sp.cost_usd.toFixed(5) : ""}</td>
      <td>${esc(sp.refused ? "refused: not on allowlist" : sp.error ? sp.error : sp.kind === "guardrail" ? (sp.passed ? "passed" : "blocked: " + (sp.violations || []).join(", ")) : "")}</td></tr>`).join("")}
    </tbody></table></div></details><div class="body" style="padding-top:0">${agentButton(cfg, true)}</div>`;
}

// On narrow screens the rail goes straight after the verdict, so the decision isn't 8,000px down.
const NARROW = window.matchMedia("(max-width:1100px)");
function placeRail() {
  const rail = $("#rail"), verdict = $(".verdict"), caseEl = $(".case");
  if (!rail || !verdict) return;
  if (NARROW.matches) verdict.after(rail); else caseEl.appendChild(rail);
}
NARROW.addEventListener ? NARROW.addEventListener("change", placeRail) : NARROW.addListener(placeRail);

function wireReport(r, qs) {
  const cq = $("#copy-qs");
  if (cq) cq.onclick = () => copyText(cq, qs.map((q, i) => `${i + 1}. ${q.question}`).join("\n"));
  $("#note-btn").onclick = async e => {
    const btn = e.currentTarget;
    try { const n = await api(`/api/prescreen/${r.report_id}/note`); copyText(btn, n.text); } catch (err) { btn.textContent = "Couldn't copy"; }
  };
  const setWatch = async on => {
    const sw = $("#watch-sw"), btn = $("#watch-btn");
    sw.disabled = btn.disabled = true;
    try {
      if (on) { const row = await api("/api/prescreen/watch", {method: "POST", body: JSON.stringify({report_id: r.report_id})}); WATCHED.set(r.company_number, row); }
      else { await api("/api/prescreen/watch/" + encodeURIComponent(r.company_number), {method: "DELETE"}); WATCHED.delete(r.company_number); }
      sw.setAttribute("aria-checked", on ? "true" : "false");
      btn.setAttribute("aria-pressed", on ? "true" : "false"); btn.textContent = on ? "Watching" : "Watch this company";
      $("#watch-msg").textContent = on ? "Watching. The registers are re-checked every morning; changes show on the desk." : "Not watched.";
    } catch (err) { $("#watch-msg").textContent = err.message; } finally { sw.disabled = btn.disabled = false; }
  };
  $("#watch-sw").onclick = () => setWatch($("#watch-sw").getAttribute("aria-checked") !== "true");
  $("#watch-btn").onclick = () => setWatch($("#watch-btn").getAttribute("aria-pressed") !== "true");

  const map = {proceed: "note", refer: "refer", decline: "outside_appetite"};
  const same = v => map[v] === r.route || (v === "decline" && r.route === "compliance_hold");
  const form = $("#decision-form");
  form.addEventListener("change", () => {
    const v = (form.querySelector("input[name=d]:checked") || {}).value;
    const differs = v && !same(v);
    $("#override").hidden = !differs;
    $("#override").textContent = differs ? `This differs from the recommendation (${ROUTE[r.route]}). Say why in the reason.` : "";
  });
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const v = form.dataset.hold ? "refer" : form.querySelector("input[name=d]:checked").value;
    try {
      const d = await api(`/api/prescreen/${r.report_id}/decision`, {method: "POST", body: JSON.stringify({
        decision: v, reason: (form.dataset.hold ? "Referred to compliance (sanctions). " : "") + $("#reason").value.trim(),
        underwriter: $("#uw").value.trim(), overrides_route: form.dataset.hold ? false : !same(v)})});
      r.decisions = [...(r.decisions || []), d];
      $("#recorded").innerHTML = `<div class="recorded">Recorded ${esc(new Date(d.recorded_at).toLocaleString("en-GB"))}: ${esc(d.decision)}${d.overrides_route ? ", against the recommendation" : ""}. It's in the file note.</div>`;
    } catch (err) { $("#recorded").innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
  });
  $("#main").onclick = e => {
    const g = e.target.closest("[data-jumpg]");
    if (g) { e.preventDefault(); const el = document.getElementById("g-" + g.dataset.jumpg) || $("#rest"); if (el) { const d = el.closest("details"); if (d) d.open = true; el.scrollIntoView({behavior: "smooth", block: "start"}); } return; }
    const j = e.target.closest("[data-jumpid]");
    if (j) { e.preventDefault(); const el = document.getElementById(j.dataset.jumpid); if (el) el.scrollIntoView({behavior: "smooth", block: "start"}); return; }
    const a = e.target.closest("[data-jump]"); if (!a) return;
    e.preventDefault();
    const el = document.getElementById("c-" + a.dataset.jump);
    if (el && el.closest("details") && !el.closest("details").open) el.closest("details").open = true;
    if (el) { el.scrollIntoView({behavior: "smooth", block: "center"}); el.classList.add("target"); setTimeout(() => el.classList.remove("target"), 1600); }
  };
}

init();
</script>
</body>
</html>
