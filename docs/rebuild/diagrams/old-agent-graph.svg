<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- The original LangGraph research graph (src/graph.py). Plain engineer style. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="960" height="760" fill="#fff"/>
  <text x="30" y="34" font-size="16" font-weight="bold" fill="#111">Before: the research graph (src/graph.py, LangGraph)</text>
  <text x="30" y="54" fill="#555">Most nodes call a model; the collector just gathers. The last node decides the risk level.</text>

  <g fill="#fff" stroke="#333" stroke-width="1">
    <rect x="30"  y="80" width="170" height="44"/>
    <rect x="260" y="80" width="170" height="44"/>
    <rect x="490" y="80" width="170" height="44"/>
    <rect x="720" y="80" width="200" height="44"/>
  </g>
  <g fill="#111" text-anchor="middle">
    <text x="115" y="100">query_understanding</text><text x="115" y="116" fill="#666" font-size="11">what is being asked</text>
    <text x="345" y="100">entity_resolution</text><text x="345" y="116" fill="#666" font-size="11">which company</text>
    <text x="575" y="100">research_planner</text><text x="575" y="116" fill="#666" font-size="11">research dimensions</text>
    <text x="820" y="100">source_selector</text><text x="820" y="116" fill="#666" font-size="11">dimension → connector</text>
  </g>
  <g stroke="#333" stroke-width="1" marker-end="url(#a)" fill="none">
    <line x1="200" y1="102" x2="258" y2="102"/>
    <line x1="430" y1="102" x2="488" y2="102"/>
    <line x1="660" y1="102" x2="718" y2="102"/>
    <path d="M820 124 V160 H480 V178"/>
  </g>

  <!-- collector and sources -->
  <rect x="300" y="180" width="360" height="44" fill="#fff" stroke="#333"/>
  <text x="480" y="200" text-anchor="middle" fill="#111">parallel_source_collector</text>
  <text x="480" y="216" text-anchor="middle" fill="#666" font-size="11">asyncio.gather over the selected retrievers</text>
  <g fill="#fff" stroke="#999" stroke-dasharray="4 3">
    <rect x="40"  y="258" width="140" height="38"/>
    <rect x="195" y="258" width="140" height="38"/>
    <rect x="350" y="258" width="120" height="38"/>
    <rect x="485" y="258" width="130" height="38"/>
    <rect x="630" y="258" width="130" height="38"/>
    <rect x="775" y="258" width="150" height="38"/>
  </g>
  <g fill="#333" text-anchor="middle" font-size="12">
    <text x="110" y="281">Companies House</text>
    <text x="265" y="281">CH PSC / fraud</text>
    <text x="410" y="281">FCA Register</text>
    <text x="550" y="281">news search</text>
    <text x="695" y="281">OpenSanctions</text>
    <text x="850" y="281">web evidence</text>
  </g>
  <g stroke="#999" stroke-width="1" fill="none">
    <path d="M330 224 L110 258"/><path d="M380 224 L265 258"/><path d="M440 224 L410 258"/>
    <path d="M520 224 L550 258"/><path d="M580 224 L695 258"/><path d="M630 224 L850 258"/>
  </g>
  <text x="40" y="314" fill="#666" font-size="11">connectors (src/connectors) via retrievers (src/retrievers)</text>

  <!-- analysis chain -->
  <g fill="#fff" stroke="#333">
    <rect x="300" y="340" width="360" height="40"/>
    <rect x="300" y="404" width="360" height="40"/>
    <rect x="300" y="468" width="360" height="40"/>
    <rect x="300" y="532" width="360" height="40"/>
    <rect x="300" y="608" width="360" height="40"/>
  </g>
  <g fill="#111" text-anchor="middle">
    <text x="480" y="365">news_classifier</text>
    <text x="480" y="429">evidence_critic</text>
    <text x="480" y="493">gap_detector</text>
    <text x="480" y="557">followup_planner</text>
    <text x="480" y="633">contradiction_detector</text>
  </g>
  <g stroke="#333" fill="none" marker-end="url(#a)">
    <line x1="480" y1="224" x2="480" y2="338"/>
    <line x1="480" y1="380" x2="480" y2="402"/>
    <line x1="480" y1="444" x2="480" y2="466"/>
    <line x1="480" y1="508" x2="480" y2="530"/>
    <line x1="480" y1="572" x2="480" y2="606"/>
  </g>
  <text x="490" y="594" fill="#555" font-size="11">continue</text>
  <!-- the follow-up loop -->
  <path d="M660 552 H945 V144 H575 V127" fill="none" stroke="#333" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <rect x="790" y="344" width="148" height="34" fill="#fff"/>
  <text x="935" y="358" text-anchor="end" fill="#333" font-size="11">iterate: follow-up loop</text>
  <text x="935" y="372" text-anchor="end" fill="#666" font-size="11">back to research_planner</text>

  <!-- synthesis -->
  <rect x="300" y="680" width="360" height="52" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="480" y="702" text-anchor="middle" fill="#111" font-weight="bold">synthesis</text>
  <text x="480" y="720" text-anchor="middle" fill="#333" font-size="12">DueDiligenceBrief: overall_risk_level, key_risks</text>
  <line x1="480" y1="648" x2="480" y2="678" stroke="#333" marker-end="url(#a)"/>
  <g font-size="12" fill="#111">
    <text x="676" y="700">← the model decides the risk level</text>
    <text x="676" y="718" fill="#555">(no written rule; a gap could read as "no risk")</text>
  </g>
  <text x="30" y="700" fill="#555" font-size="11">Eval, 9 companies: 14.9 model</text>
  <text x="30" y="714" fill="#555" font-size="11">calls a run, median 89 s</text>
</svg>
