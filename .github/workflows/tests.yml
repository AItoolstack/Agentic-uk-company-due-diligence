name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Apply Supabase migrations to a throwaway database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "create role anon; create role authenticated;"
          for f in supabase/migrations/*.sql; do psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"; done

      - name: Compile source
        run: python -m compileall -q src app.py api_server.py

      - name: Run offline tests
        env:
          USE_MOCK_DATA: "true"
          TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -q -m "not eval"
