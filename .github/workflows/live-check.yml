name: live check of the Space

# After a deploy: is the Space up, does / still serve the current page, does /case serve the case page,
# and (when the PRESCREEN_ACCESS_TOKEN repository secret exists) do the 9 evaluation companies keep their
# routes under rules 19f. 9 pre-screens, well under the Space's 30 an hour. Run by hand.
# Needs repository secrets: HF_TOKEN (the Space is private); PRESCREEN_ACCESS_TOKEN optional (same value
# as the Space secret of that name). Nothing prints either value.
on:
  workflow_dispatch:

concurrency: live-check

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Check the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PRESCREEN_ACCESS_TOKEN: ${{ secrets.PRESCREEN_ACCESS_TOKEN }}
          SPACE_URL: https://aitoolstack-agentic-uk-company-due-diligence.hf.space
        run: python scripts/live_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-check
          path: live-check.json
